<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Akimark Account</title>
    <style>
        /* ==== RESET & BASE (same as home) ==== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #080808;
            --bg-surface: #151515;
            --bg-secondary: #1C1C1C;
            --accent: #c71515;
            --accent-soft: #a00f0f;
            --white: #FFFFFF;
            --text-muted: #A7A7A7;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --radius: 12px;
            --radius-sm: 8px;
            --radius-lg: 20px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            --transition: 0.25s cubic-bezier(0.2, 0, 0, 1);
            --header-height: 62px;
        }

        html {
            font-size: 16px;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
            background: var(--bg-primary);
            color: var(--white);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        a { color: inherit; text-decoration: none; }
        button { cursor: pointer; font-family: inherit; border: none; background: none; color: inherit; }
        input { font-family: inherit; border: none; outline: none; background: none; color: inherit; }
        img { display: block; max-width: 100%; }
        ul { list-style: none; }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
        .muted-text { color: var(--text-muted); }

        /* ==== HEADER (same as home) ==== */
        .header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(8, 8, 8, 0.95); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-subtle); padding: 12px 0;
            transition: background var(--transition);
        }
        .header .container { display: flex; align-items: center; justify-content: space-between; }
        .logo { display: flex; align-items: center; }
        .logo img { height: 40px; width: auto; object-fit: contain; background: transparent; }
        .desktop-nav { display: none; align-items: center; gap: 28px; }
        .desktop-nav a { font-size: 0.95rem; font-weight: 500; color: var(--text-muted); transition: color var(--transition); }
        .desktop-nav a:hover, .desktop-nav a.active { color: var(--white); }
        .header-actions { display: flex; align-items: center; gap: 8px; }

        /* ==== ACCOUNT CARD ==== */
        .account-section {
            max-width: 600px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .account-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 32px 24px;
            box-shadow: var(--shadow);
            animation: fadeUp 0.35s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .account-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 20px;
        }

        .account-avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--bg-secondary);
            border: 2px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .account-avatar svg {
            width: 40px;
            height: 40px;
            fill: var(--text-muted);
        }

        .account-header .account-title h2 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .account-header .account-title p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .account-detail {
            margin-bottom: 24px;
        }

        .account-detail-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .account-detail-value {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            font-size: 1rem;
            font-weight: 600;
        }

        .account-detail-value svg {
            width: 20px;
            height: 20px;
            fill: var(--accent);
            flex-shrink: 0;
        }

        .account-actions {
            display: flex;
            gap: 12px;
            margin-top: 32px;
        }

        .btn-accent {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--accent);
            color: #fff;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 12px 24px;
            border-radius: 50px;
            transition: background var(--transition), transform var(--transition);
            border: none;
            flex: 1;
        }

        .btn-accent:hover {
            background: var(--accent-soft);
            transform: scale(1.02);
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--bg-secondary);
            color: var(--white);
            font-weight: 600;
            font-size: 0.95rem;
            padding: 12px 24px;
            border-radius: 50px;
            border: 1px solid var(--border-subtle);
            transition: background var(--transition), border var(--transition);
            flex: 1;
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.06);
            border-color: var(--accent);
        }

        .btn-secondary svg, .btn-accent svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* ==== MOBILE BOTTOM NAV (same as home) ==== */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
            background: rgba(8, 8, 8, 0.96); backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-subtle);
            display: flex; justify-content: space-around;
            padding: 16px 0 12px;
            height: 72px;
        }

        .bottom-nav a {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 4px; font-size: 0.65rem; font-weight: 500; color: var(--text-muted);
            transition: color var(--transition); padding: 0 12px; min-width: 56px;
        }

        .bottom-nav a svg { width: 24px; height: 24px; fill: currentColor; }
        .bottom-nav a:hover, .bottom-nav a.active { color: var(--accent); }
        .bottom-nav a.active svg { fill: var(--accent); }

        @media (min-width: 900px) {
            .desktop-nav { display: flex; }
            .bottom-nav { display: none; }
            body { padding-bottom: 0; }
        }

        /* Toast */
        .toast {
            position: fixed; bottom: 150px; left: 50%; transform: translateX(-50%);
            z-index: 500; background: var(--bg-surface); border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm); padding: 12px 20px; box-shadow: var(--shadow);
            display: none; align-items: center; gap: 10px; font-size: 0.9rem;
            max-width: 90%; animation: slideUp 0.3s ease;
        }
        .toast.visible { display: flex; }
        .toast svg { width: 20px; height: 20px; fill: var(--accent); }

        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(30px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER (same as home) ===== -->
    <header class="header">
        <div class="container">
            <div class="logo" id="logoHome">
                <img src="images/logo-akimark.png" onerror="this.onerror=null; this.src='images/logo-akimark.jpg';" alt="Akimark Logo">
            </div>
            <nav class="desktop-nav" id="desktopNav">
                <a href="home" data-page="home">Home</a>
                <a href="movies" data-page="movies">Movies</a>
                <a href="series" data-page="series">Series</a>
                <a href="categories" data-page="categories">Categories</a>
                <a href="account" class="active" data-page="account">Account</a>
            </nav>
            <div class="header-actions"></div>
        </div>
    </header>

    <!-- ===== ACCOUNT SECTION ===== -->
    <div class="account-section">
        <div class="account-card">
            <div class="account-header">
                <div class="account-avatar">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                </div>
                <div class="account-title">
                    <h2>My Account</h2>
                    <p id="accountFullName">Loading...</p>
                </div>
            </div>

            <div class="account-detail">
                <div class="account-detail-label">User ID</div>
                <div class="account-detail-value">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.11 0-2 .89-2 2v12c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm-8 6c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3zm-7 10c0-2.33 4.67-3.5 7-3.5s7 1.17 7 3.5v.5H5v-.5z"/></svg>
                    <span id="accountUserId">Loading...</span>
                </div>
            </div>

            <div class="account-detail">
                <div class="account-detail-label">Phone Number</div>
                <div class="account-detail-value">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                    <span id="accountPhone">Loading...</span>
                </div>
            </div>

            <div class="account-actions">
                <button class="btn-accent" id="logoutBtn">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 17l5-5-5-5v3H3v4h7v3zm8-14h-6v2h6v14h-6v2h6c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
                    Logout
                </button>
                <button class="btn-secondary" id="settingsBtn">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                    Settings
                </button>
            </div>
        </div>
    </div>

    <!-- ===== MOBILE BOTTOM NAV (same as home) ===== -->
    <nav class="bottom-nav">
        <a href="home">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            Home
        </a>
        <a href="movies">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5z"/></svg>
            Search
        </a>
        <a href="movies">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-2z"/></svg>
            Movies
        </a>
        <a href="account" class="active">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            Account
        </a>
    </nav>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        <span id="toastMsg">Done</span>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script src="javascript.js/account.js"></script>
</body>
</html>
