<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>View Film - Akimark</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #080808;
            --bg-surface: #151515;
            --bg-secondary: #1C1C1C;
            --accent: #c71515;
            --accent-soft: #a00f0f;
            --white: #FFFFFF;
            --text-muted: #A7A7A7;
            --border-subtle: rgba(255,255,255,0.08);
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 8px 32px rgba(0,0,0,0.6);
            --transition: 0.25s cubic-bezier(0.2,0,0,1);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary); color: #fff; line-height: 1.6; min-height: 100vh;
            overflow-x: hidden; user-select: none; -webkit-user-select: none;
        }
        body::-webkit-scrollbar { display: none; }
        body { -ms-overflow-style: none; scrollbar-width: none; }

        a { color: inherit; text-decoration: none; }
        button { cursor: pointer; font-family: inherit; border: none; background: none; color: inherit; }
        img { display: block; max-width: 100%; }

        .header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(8,8,8,0.95); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-subtle); padding: 10px 0;
        }
        .header .container {
            max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 0 16px;
        }
        .logo img { height: 32px; width: auto; object-fit: contain; }
        .header-actions { display: flex; align-items: center; gap: 10px; }

        /* ‹ BACK button */
        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--text-muted); font-size: 0.85rem; font-weight: 500;
            padding: 8px 12px; border-radius: 50px;
            transition: color 0.3s, background 0.3s;
            text-decoration: none;
        }
        .back-btn:hover { color: #fff; background: rgba(255,255,255,0.06); }

        .container { max-width: 1000px; margin: 0 auto; padding: 20px 16px; }

        /* SKELETON */
        .skeleton-loader { display: none; }
        .skeleton-loader.show { display: block; }
        .skeleton-poster {
            width: 100%; height: 300px; border-radius: var(--radius);
            background: linear-gradient(90deg, #151515 25%, #222 50%, #151515 75%);
            background-size: 200% 100%; animation: shimmer 1.2s infinite; margin-bottom: 20px;
        }
        .skeleton-line {
            height: 14px; border-radius: 4px; margin-bottom: 12px;
            background: linear-gradient(90deg, #151515 25%, #222 50%, #151515 75%);
            background-size: 200% 100%; animation: shimmer 1.2s infinite;
        }
        .skeleton-line.short { width: 30%; }
        .skeleton-line.medium { width: 60%; }
        .skeleton-line.long { width: 90%; }
        .skeleton-price {
            height: 30px; width: 50%; border-radius: 8px; margin: 20px 0;
            background: linear-gradient(90deg, #151515 25%, #222 50%, #151515 75%);
            background-size: 200% 100%; animation: shimmer 1.2s infinite;
        }
        .skeleton-btn {
            height: 48px; border-radius: 12px; margin-top: 10px;
            background: linear-gradient(90deg, #151515 25%, #222 50%, #151515 75%);
            background-size: 200% 100%; animation: shimmer 1.2s infinite;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        /* FILM DETAILS */
        .film-details { display: none; animation: fadeUp 0.4s ease; }
        .film-details.show { display: block; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .film-layout { display: grid; gap: 20px; }
        .film-poster {
            border-radius: var(--radius); overflow: hidden; background: #1C1C1C;
            border: 1px solid var(--border-subtle); aspect-ratio: 2/3;
            max-width: 320px; margin: 0 auto; width: 100%; box-shadow: var(--shadow);
        }
        .film-poster img { width: 100%; height: 100%; object-fit: cover; }
        .film-info { display: flex; flex-direction: column; }
        .film-title {
            font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px;
            margin-bottom: 8px; text-transform: uppercase; line-height: 1.2;
        }
        .film-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
        .tag {
            display: inline-flex; align-items: center; padding: 4px 10px;
            background: #1C1C1C; border: 1px solid var(--border-subtle);
            border-radius: 50px; font-size: 0.75rem; color: #A7A7A7; font-weight: 500;
        }
        .tag.accent {
            background: rgba(199,21,21,0.2); border-color: rgba(199,21,21,0.4);
            color: #c71515; font-weight: 700;
        }
        .film-description { color: #A7A7A7; font-size: 0.9rem; line-height: 1.7; margin-bottom: 20px; }
        .film-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .meta-item { background: #151515; border: 1px solid var(--border-subtle); border-radius: 8px; padding: 12px; }
        .meta-label { font-size: 0.7rem; color: #A7A7A7; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        .meta-value { font-size: 0.95rem; font-weight: 700; color: #fff; }
        .price-section {
            background: #151515; border: 1px solid var(--border-subtle); border-radius: 12px;
            padding: 16px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;
        }
        .price-label { font-size: 0.85rem; color: #A7A7A7; font-weight: 500; }
        .price-value { font-size: 1.8rem; font-weight: 900; color: #c71515; letter-spacing: -0.5px; }

        .pay-btn {
            width: 100%; padding: 16px 24px;
            background: linear-gradient(135deg, #c71515, #a00f0f);
            color: #fff; font-size: 1rem; font-weight: 800; border: none; border-radius: 12px;
            cursor: pointer; transition: all 0.25s; display: flex; align-items: center;
            justify-content: center; gap: 8px; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .pay-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(199,21,21,0.4); }
        .pay-btn:disabled { background: #444; cursor: not-allowed; transform: none; box-shadow: none; }
        .pay-btn .btn-spinner {
            width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: none;
        }
        .pay-btn.loading .btn-spinner { display: inline-block; }
        .pay-btn.loading { opacity: 0.8; pointer-events: none; }

        .video-section { display: none; margin-top: 20px; }
        .video-section.show { display: block; }

        .error-state { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; text-align: center; padding: 20px; }
        .error-icon { font-size: 3rem; margin-bottom: 12px; }
        .error-text { color: #ff4d4d; font-size: 1rem; margin-bottom: 20px; }
        .error-btn { padding: 10px 20px; background: #c71515; color: #fff; border-radius: 50px; font-weight: 600; font-size: 0.9rem; transition: background 0.3s; }
        .error-btn:hover { background: #a00f0f; }

        @media (min-width: 768px) {
            .film-layout { grid-template-columns: 1fr 1.5fr; gap: 32px; }
            .film-poster { margin: 0; max-width: 100%; }
            .film-title { font-size: 2.2rem; }
            .pay-btn { max-width: 320px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="home.html" class="logo">
                <img src="images/logo-akimark.png" onerror="this.onerror=null; this.src='images/logo-akimark.jpg';" alt="Akimark Logo">
            </a>
            <div class="header-actions">
                <!-- ‹ BACK button -->
                <a href="javascript:history.back()" class="back-btn">
                    <span>‹</span> BACK
                </a>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Skeleton -->
        <div id="skeletonLoader" class="skeleton-loader">
            <div class="skeleton-poster"></div>
            <div class="skeleton-line long"></div>
            <div class="skeleton-line medium"></div>
            <div class="skeleton-line short"></div>
            <div class="skeleton-line long"></div>
            <div class="skeleton-price"></div>
            <div class="skeleton-btn"></div>
        </div>

        <!-- Error -->
        <div id="errorState" class="error-state" style="display: none;">
            <div class="error-icon">⚠️</div>
            <div class="error-text" id="errorMessage">Film not found</div>
            <a href="home.html" class="error-btn">Go Back Home</a>
        </div>

        <!-- Film Details -->
        <div id="filmDetails" class="film-details">
            <div class="film-layout">
                <div class="film-poster">
                    <img id="filmPoster" src="" alt="Film Poster">
                </div>
                <div class="film-info">
                    <h1 class="film-title" id="filmTitle">Loading...</h1>
                    <div class="film-tags" id="filmTags"></div>
                    <p class="film-description" id="filmDescription">Loading...</p>
                    <div class="film-meta">
                        <div class="meta-item"><div class="meta-label">Year</div><div class="meta-value" id="filmYear">-</div></div>
                        <div class="meta-item"><div class="meta-label">Duration</div><div class="meta-value" id="filmDuration">-</div></div>
                        <div class="meta-item"><div class="meta-label">Quality</div><div class="meta-value" id="filmQuality">-</div></div>
                        <div class="meta-item"><div class="meta-label">Category</div><div class="meta-value" id="filmCategory">-</div></div>
                        <div class="meta-item"><div class="meta-label">Translator</div><div class="meta-value" id="filmTranslator">-</div></div>
                    </div>
                    <div class="price-section">
                        <span class="price-label">Price</span>
                        <span class="price-value" id="filmPrice">MK 0</span>
                    </div>
                    <button class="pay-btn" id="payBtn">
                        <span class="btn-spinner"></span>
                        <span id="payBtnText">Pay Now</span>
                    </button>
                    <div id="videoSection" class="video-section">
                        <button class="pay-btn" id="watchNowBtn"><span>▶ Watch Now</span></button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="javascript.js/supabase.js"></script>
    <script src="javascript.js/view-film.js"></script>
</body>
</html>
