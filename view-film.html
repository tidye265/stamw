<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>View Film - Akimark</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #080808;
            --bg-surface: #151515;
            --bg-secondary: #1C1C1C;
            --accent: #c71515;
            --accent-soft: #a00f0f;
            --white: #FFFFFF;
            --text-muted: #A7A7A7;
            --border-subtle: rgba(255,255,255,0.08);
            --radius: 10px;
            --radius-sm: 6px;
            --shadow: 0 4px 12px rgba(0,0,0,0.4);
            --transition: 0.2s cubic-bezier(0.2,0,0,1);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary); color: #fff; line-height: 1.5; min-height: 100vh;
            overflow-x: hidden; user-select: none; -webkit-user-select: none;
        }
        body::-webkit-scrollbar { display: none; }
        body { -ms-overflow-style: none; scrollbar-width: none; }

        a { color: inherit; text-decoration: none; }
        button { cursor: pointer; font-family: inherit; border: none; background: none; color: inherit; }
        img { display: block; max-width: 100%; }

        /* HEADER */
        .header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(8,8,8,0.95); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-subtle); padding: 8px 0;
        }
        .header .container {
            max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 0 12px;
        }
        .logo img { height: 28px; width: auto; object-fit: contain; }
        .header-actions { display: flex; align-items: center; gap: 8px; }

        /* BACK ICON (SVG real icon) */
        .back-btn {
            display: inline-flex; align-items: center; gap: 4px;
            color: var(--text-muted); font-size: 0.8rem; font-weight: 600;
            padding: 6px 10px; border-radius: 50px;
            transition: color 0.2s, background 0.2s;
            text-decoration: none;
        }
        .back-btn svg {
            width: 16px; height: 16px; fill: currentColor;
        }
        .back-btn:hover { color: #fff; background: rgba(255,255,255,0.08); }

        /* MAIN CONTAINER */
        .container { max-width: 800px; margin: 0 auto; padding: 12px; }

        /* SKELETON */
        .skeleton-loader { display: none; }
        .skeleton-loader.show { display: block; }
        .skeleton-poster {
            width: 100%; height: 180px; border-radius: var(--radius);
            background: linear-gradient(90deg, #151515 25%, #222 50%, #151515 75%);
            background-size: 200% 100%; animation: shimmer 1.2s infinite; margin-bottom: 12px;
        }
        .skeleton-line {
            height: 12px; border-radius: 4px; margin-bottom: 8px;
            background: linear-gradient(90deg, #151515 25%, #222 50%, #151515 75%);
            background-size: 200% 100%; animation: shimmer 1.2s infinite;
        }
        .skeleton-line.short { width: 30%; }
        .skeleton-line.medium { width: 60%; }
        .skeleton-line.long { width: 90%; }
        .skeleton-price {
            height: 24px; width: 50%; border-radius: 6px; margin: 12px 0;
            background: linear-gradient(90deg, #151515 25%, #222 50%, #151515 75%);
            background-size: 200% 100%; animation: shimmer 1.2s infinite;
        }
        .skeleton-btn {
            height: 40px; border-radius: 8px; margin-top: 8px;
            background: linear-gradient(90deg, #151515 25%, #222 50%, #151515 75%);
            background-size: 200% 100%; animation: shimmer 1.2s infinite;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        /* FILM DETAILS */
        .film-details { display: none; animation: fadeUp 0.3s ease; }
        .film-details.show { display: block; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Compact Layout */
        .film-layout { display: flex; flex-direction: column; gap: 12px; }
        .film-poster {
            border-radius: var(--radius); overflow: hidden; background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            width: 100%; max-width: 260px; margin: 0 auto;
            aspect-ratio: 16/9; /* Compact landscape poster */
        }
        .film-poster img { width: 100%; height: 100%; object-fit: cover; }

        .film-info { display: flex; flex-direction: column; }

        .film-title {
            font-size: 1.3rem; font-weight: 800; letter-spacing: -0.3px;
            margin-bottom: 6px; text-transform: uppercase; line-height: 1.2;
        }
        .film-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
        .tag {
            display: inline-flex; align-items: center; padding: 3px 8px;
            background: var(--bg-secondary); border: 1px solid var(--border-subtle);
            border-radius: 50px; font-size: 0.65rem; color: var(--text-muted); font-weight: 500;
        }
        .tag.accent {
            background: rgba(199,21,21,0.2); border-color: rgba(199,21,21,0.4);
            color: var(--accent); font-weight: 700;
        }
        .film-description {
            color: var(--text-muted); font-size: 0.8rem; line-height: 1.5; margin-bottom: 12px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }

        /* Meta compact */
        .film-meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
        .meta-item { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 6px; padding: 6px; }
        .meta-label { font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 2px; }
        .meta-value { font-size: 0.8rem; font-weight: 700; color: #fff; }

        /* Price */
        .price-section {
            background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 8px;
            padding: 10px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;
        }
        .price-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 500; }
        .price-value { font-size: 1.3rem; font-weight: 900; color: var(--accent); }

        /* Buttons */
        .pay-btn {
            width: 100%; padding: 12px 16px;
            background: linear-gradient(135deg, var(--accent), var(--accent-soft));
            color: #fff; font-size: 0.9rem; font-weight: 800; border: none; border-radius: 8px;
            cursor: pointer; transition: all 0.2s; display: flex; align-items: center;
            justify-content: center; gap: 6px; text-transform: uppercase; letter-spacing: 0.3px;
        }
        .pay-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(199,21,21,0.3); }
        .pay-btn:disabled { background: #444; cursor: not-allowed; transform: none; box-shadow: none; }
        .pay-btn .btn-spinner {
            width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: none;
        }
        .pay-btn.loading .btn-spinner { display: inline-block; }
        .pay-btn.loading { opacity: 0.8; pointer-events: none; }

        .video-section { display: none; margin-top: 12px; }
        .video-section.show { display: block; }

        /* Error */
        .error-state { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; text-align: center; padding: 20px; }
        .error-icon { font-size: 2.5rem; margin-bottom: 10px; }
        .error-text { color: #ff4d4d; font-size: 0.9rem; margin-bottom: 15px; }
        .error-btn { padding: 8px 16px; background: var(--accent); color: #fff; border-radius: 50px; font-weight: 600; font-size: 0.85rem; transition: background 0.3s; }
        .error-btn:hover { background: var(--accent-soft); }

        /* Desktop (larger screens) */
        @media (min-width: 768px) {
            .container { padding: 20px; }
            .film-layout { flex-direction: row; gap: 24px; align-items: flex-start; }
            .film-poster { max-width: 300px; aspect-ratio: 2/3; }
            .film-title { font-size: 1.8rem; }
            .film-meta { grid-template-columns: repeat(5, 1fr); }
            .pay-btn { max-width: 320px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="home.html" class="logo">
                <img src="images/logo-akimark.png" onerror="this.onerror=null; this.src='images/logo-akimark.jpg';" alt="Akimark Logo">
            </a>
            <div class="header-actions">
                <!-- BACK ICON (SVG) -->
                <a href="javascript:history.back()" class="back-btn">
                    <svg viewBox="0 0 24 24" width="16" height="16"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <span>BACK</span>
                </a>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Skeleton -->
        <div id="skeletonLoader" class="skeleton-loader">
            <div class="skeleton-poster"></div>
            <div class="skeleton-line long"></div>
            <div class="skeleton-line medium"></div>
            <div class="skeleton-line short"></div>
            <div class="skeleton-line long"></div>
            <div class="skeleton-price"></div>
            <div class="skeleton-btn"></div>
        </div>

        <!-- Error -->
        <div id="errorState" class="error-state" style="display: none;">
            <div class="error-icon">⚠️</div>
            <div class="error-text" id="errorMessage">Film not found</div>
            <a href="home.html" class="error-btn">Go Back Home</a>
        </div>

        <!-- Film Details -->
        <div id="filmDetails" class="film-details">
            <div class="film-layout">
                <div class="film-poster">
                    <img id="filmPoster" src="" alt="Film Poster">
                </div>
                <div class="film-info">
                    <h1 class="film-title" id="filmTitle">Loading...</h1>
                    <div class="film-tags" id="filmTags"></div>
                    <p class="film-description" id="filmDescription">Loading...</p>
                    <div class="film-meta">
                        <div class="meta-item"><div class="meta-label">Year</div><div class="meta-value" id="filmYear">-</div></div>
                        <div class="meta-item"><div class="meta-label">Duration</div><div class="meta-value" id="filmDuration">-</div></div>
                        <div class="meta-item"><div class="meta-label">Quality</div><div class="meta-value" id="filmQuality">-</div></div>
                        <div class="meta-item"><div class="meta-label">Category</div><div class="meta-value" id="filmCategory">-</div></div>
                        <div class="meta-item"><div class="meta-label">Translator</div><div class="meta-value" id="filmTranslator">-</div></div>
                    </div>
                    <div class="price-section">
                        <span class="price-label">Price</span>
                        <span class="price-value" id="filmPrice">MK 0</span>
                    </div>
                    <button class="pay-btn" id="payBtn">
                        <span class="btn-spinner"></span>
                        <span id="payBtnText">Pay Now</span>
                    </button>
                    <div id="videoSection" class="video-section">
                        <button class="pay-btn" id="watchNowBtn"><span>▶ Watch Now</span></button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="javascript.js/supabase.js"></script>
    <script src="javascript.js/view-film.js"></script>
</body>
</html>
