<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>View Film - Akimark</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #080808;
            --bg-surface: #151515;
            --bg-secondary: #1C1C1C;
            --accent: #c71515;
            --accent-soft: #a00f0f;
            --white: #FFFFFF;
            --text-muted: #A7A7A7;
            --border-subtle: rgba(255,255,255,0.08);
            --radius: 8px;
            --radius-sm: 4px;
            --shadow: 0 4px 12px rgba(0,0,0,0.4);
            --transition: 0.2s cubic-bezier(0.2,0,0,1);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary); color: #fff; line-height: 1.5; min-height: 100vh;
            overflow-x: hidden; user-select: none; -webkit-user-select: none;
        }
        body::-webkit-scrollbar { display: none; }
        body { -ms-overflow-style: none; scrollbar-width: none; }

        a { color: inherit; text-decoration: none; }
        button { cursor: pointer; font-family: inherit; border: none; background: none; color: inherit; }
        img { display: block; max-width: 100%; }

        .header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(8,8,8,0.95); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-subtle); padding: 8px 0;
        }
        .header .container {
            max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 0 12px;
        }
        .logo img { height: 28px; width: auto; object-fit: contain; }
        .header-actions { display: flex; align-items: center; gap: 8px; }

        .back-btn {
            display: inline-flex; align-items: center; gap: 4px;
            color: var(--text-muted); font-size: 0.8rem; font-weight: 600;
            padding: 6px 10px; border-radius: 6px;
            transition: color 0.2s, background 0.2s;
            text-decoration: none;
        }
        .back-btn svg { width: 16px; height: 16px; fill: currentColor; }
        .back-btn:hover { color: #fff; background: rgba(255,255,255,0.08); }

        .container { max-width: 700px; margin: 0 auto; padding: 16px 12px; }

        /* SKELETON - Updated to match new layout */
        .skeleton-loader { display: none; }
        .skeleton-loader.show { display: block; }
        .skeleton-profile {
            width: 100%; height: 100px; border-radius: 8px;
            background: linear-gradient(90deg, #151515 25%, #222 50%, #151515 75%);
            background-size: 200% 100%; animation: shimmer 1.2s infinite; margin-bottom: 12px;
        }
        .skeleton-line { height: 12px; border-radius: 4px; margin-bottom: 8px; background: linear-gradient(90deg, #151515 25%, #222 50%, #151515 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
        .skeleton-line.short { width: 30%; }
        .skeleton-line.medium { width: 60%; }
        .skeleton-line.long { width: 90%; }
        .skeleton-btn { height: 50px; border-radius: 6px; margin-top: 8px; width: 100%; background: linear-gradient(90deg, #151515 25%, #222 50%, #151515 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

        /* FILM DETAILS */
        .film-details { display: none; animation: fadeUp 0.3s ease; }
        .film-details.show { display: block; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* PROFILE CARD - CENTER */
        .profile-card {
            display: flex; flex-direction: column; align-items: center;
            background: var(--bg-surface); border: 1px solid var(--border-subtle);
            border-radius: 10px; padding: 20px; margin-bottom: 16px;
        }
        .profile-avatar {
            width: 80px; height: 80px; border-radius: 50%;
            overflow: hidden; background: var(--bg-secondary);
            border: 2px solid var(--accent); display: flex; align-items: center; justify-content: center;
        }
        .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-avatar svg { width: 40px; height: 40px; fill: var(--text-muted); }
        .profile-name { font-size: 1.2rem; font-weight: 800; margin-top: 10px; }
        .profile-followers { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }
        .follow-btn {
            background: #fff; color: #111; border: none; border-radius: 6px;
            padding: 8px 24px; font-size: 0.85rem; font-weight: 700; cursor: pointer;
            margin-top: 12px; transition: background 0.2s, color 0.2s;
        }
        .follow-btn.following { background: transparent; color: #fff; border: 1px solid var(--border-subtle); }
        .follow-btn:hover { background: var(--bg-secondary); color: #fff; }

        /* FILM INFO */
        .film-info { text-align: center; }
        .film-title { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.3px; margin-bottom: 6px; text-transform: uppercase; }
        .film-tags { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin-bottom: 10px; }
        .tag { display: inline-flex; align-items: center; padding: 3px 8px; background: var(--bg-secondary); border: 1px solid var(--border-subtle); border-radius: 50px; font-size: 0.65rem; color: var(--text-muted); font-weight: 500; }
        .film-description { color: var(--text-muted); font-size: 0.85rem; line-height: 1.5; margin-bottom: 16px; }

        .film-meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 20px; }
        .meta-item { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 4px; padding: 8px; text-align: center; }
        .meta-label { font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 2px; }
        .meta-value { font-size: 0.8rem; font-weight: 700; color: #fff; }

        /* WATCH NOW BUTTON */
        .watch-btn {
            width: 100%; padding: 14px 16px;
            background: linear-gradient(135deg, var(--accent), var(--accent-soft));
            color: #fff; font-size: 1rem; font-weight: 800; border: none; border-radius: 6px;
            cursor: pointer; transition: all 0.2s; display: flex; align-items: center;
            justify-content: center; gap: 8px; text-transform: uppercase; letter-spacing: 0.3px;
        }
        .watch-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(199,21,21,0.3); }
        .watch-btn:disabled { background: #444; cursor: not-allowed; transform: none; box-shadow: none; }
        .watch-btn .btn-spinner {
            width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff; border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }
        .watch-btn.loading .btn-spinner { display: inline-block; }
        .watch-btn.loading { opacity: 0.8; pointer-events: none; }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-message { display: none; align-items: center; justify-content: center; gap: 6px; margin-top: 10px; font-size: 0.9rem; font-weight: 600; }
        .status-message.show { display: flex; }
        .status-message.success { color: #4caf50; }
        .status-message.error { color: #ff4d4d; }
        .status-message svg { width: 18px; height: 18px; }

        /* ERROR STATE */
        .error-state { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; text-align: center; padding: 20px; }
        .error-icon { font-size: 2.5rem; margin-bottom: 10px; }
        .error-text { color: #ff4d4d; font-size: 0.9rem; margin-bottom: 15px; }
        .error-btn { padding: 8px 16px; background: var(--accent); color: #fff; border-radius: 6px; font-weight: 600; font-size: 0.85rem; transition: background 0.3s; }
        .error-btn:hover { background: var(--accent-soft); }

        @media (min-width: 768px) {
            .container { padding: 24px; }
            .profile-card { max-width: 400px; margin: 0 auto 20px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="home.html" class="logo">
                <img src="images/logo-akimark.png" onerror="this.onerror=null; this.src='images/logo-akimark.jpg';" alt="Akimark Logo">
            </a>
            <div class="header-actions">
                <a href="javascript:history.back()" class="back-btn">
                    <svg viewBox="0 0 24 24" width="16" height="16"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <span>BACK</span>
                </a>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Skeleton -->
        <div id="skeletonLoader" class="skeleton-loader">
            <div class="skeleton-profile"></div>
            <div class="skeleton-line short"></div>
            <div class="skeleton-line medium"></div>
            <div class="skeleton-line long"></div>
            <div class="skeleton-btn"></div>
        </div>

        <!-- Error -->
        <div id="errorState" class="error-state" style="display: none;">
            <div class="error-icon">⚠️</div>
            <div class="error-text" id="errorMessage">Film not found</div>
            <a href="home.html" class="error-btn">Go Back Home</a>
        </div>

        <!-- Film Details -->
        <div id="filmDetails" class="film-details">
            <!-- Translator Profile - CENTER -->
            <div class="profile-card" id="translatorProfile" style="display:none;">
                <div class="profile-avatar" id="translatorAvatarContainer">
                    <!-- Default icon if no image -->
                    <svg id="translatorAvatarSvg" viewBox="0 0 24 24" style="display:none;"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    <img id="translatorAvatar" src="" alt="Translator Avatar" style="display:none;">
                </div>
                <div class="profile-name" id="translatorName">Translator</div>
                <div class="profile-followers" id="translatorFollowers">0 followers</div>
                <button class="follow-btn" id="followBtn">Follow</button>
            </div>

            <!-- Film Info -->
            <div class="film-info">
                <h1 class="film-title" id="filmTitle">Loading...</h1>
                <div class="film-tags" id="filmTags"></div>
                <p class="film-description" id="filmDescription">Loading...</p>

                <div class="film-meta">
                    <div class="meta-item"><div class="meta-label">Year</div><div class="meta-value" id="filmYear">-</div></div>
                    <div class="meta-item"><div class="meta-label">Quality</div><div class="meta-value" id="filmQuality">-</div></div>
                    <div class="meta-item"><div class="meta-label">Category</div><div class="meta-value" id="filmCategory">-</div></div>
                </div>

                <!-- WATCH NOW BUTTON -->
                <button class="watch-btn" id="payBtn">
                    <span class="btn-spinner"></span>
                    <span id="payBtnText">WATCH NOW</span>
                </button>

                <!-- Status -->
                <div id="statusMessage" class="status-message"></div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="javascript.js/supabase.js"></script>
    <script src="javascript.js/view-film.js"></script>
</body>
</html>
