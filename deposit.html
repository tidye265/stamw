<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Deposit - Akimark</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #080808;
            --bg-surface: #151515;
            --bg-secondary: #1C1C1C;
            --accent: #c71515;
            --accent-soft: #a00f0f;
            --white: #FFFFFF;
            --text-muted: #A7A7A7;
            --border-subtle: rgba(255,255,255,0.08);
            --radius: 8px;
            --radius-sm: 6px;
            --transition: 0.2s cubic-bezier(0.2,0,0,1);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary); color: var(--white); line-height: 1.5; min-height: 100vh;
            overflow-x: hidden; user-select: none; -webkit-user-select: none;
        }
        body::-webkit-scrollbar { display: none; }
        body { -ms-overflow-style: none; scrollbar-width: none; }

        a { color: inherit; text-decoration: none; }
        button { cursor: pointer; font-family: inherit; border: none; background: none; color: inherit; }
        img { display: block; max-width: 100%; }

        /* Header */
        .header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(8,8,8,0.95); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-subtle); padding: 8px 0;
        }
        .header .container {
            max-width: 700px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 0 12px;
        }
        .logo img { height: 28px; width: auto; object-fit: contain; }
        .header-actions { display: flex; align-items: center; gap: 8px; }
        .back-btn {
            display: inline-flex; align-items: center; gap: 4px;
            color: var(--text-muted); font-size: 0.8rem; font-weight: 600;
            padding: 6px 10px; border-radius: 6px; transition: color 0.2s, background 0.2s;
        }
        .back-btn svg { width: 16px; height: 16px; fill: currentColor; }
        .back-btn:hover { color: #fff; background: rgba(255,255,255,0.08); }

        /* Main */
        .container { max-width: 600px; margin: 0 auto; padding: 16px; }

        h1 { font-size: 1.4rem; font-weight: 800; margin-bottom: 20px; text-align: center; }

        /* Amount input */
        .amount-section { margin-bottom: 20px; }
        .amount-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
        .amount-input-wrap {
            display: flex; align-items: center; background: var(--bg-surface);
            border: 1px solid var(--border-subtle); border-radius: var(--radius); padding: 4px;
        }
        .amount-input-wrap input {
            flex: 1; background: transparent; border: none; outline: none; color: var(--white);
            font-size: 1.2rem; font-weight: 700; padding: 10px 12px; min-width: 0;
        }
        .amount-input-wrap .currency { font-size: 1rem; font-weight: 700; color: var(--accent); padding-right: 12px; }

        /* Deposit method */
        .method-section { margin-bottom: 20px; }
        .method-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
        .method-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .method-card {
            background: var(--bg-surface); border: 1px solid var(--border-subtle);
            border-radius: var(--radius); padding: 12px; text-align: center; cursor: pointer;
            transition: border 0.2s, background 0.2s, transform 0.2s;
        }
        .method-card.selected { border-color: var(--accent); background: rgba(199,21,21,0.1); transform: scale(1.02); }
        .method-card img { width: 80px; height: 80px; object-fit: contain; margin: 0 auto 8px; }
        .method-name { font-size: 0.9rem; font-weight: 700; }

        /* Submit button */
        .submit-btn {
            width: 100%; padding: 14px; background: linear-gradient(135deg, var(--accent), var(--accent-soft));
            color: #fff; font-size: 1rem; font-weight: 800; border: none; border-radius: var(--radius);
            cursor: pointer; transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.3px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(199,21,21,0.3); }
        .submit-btn:disabled { background: #444; cursor: not-allowed; transform: none; box-shadow: none; }
        .submit-btn .btn-spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
        .submit-btn.loading .btn-spinner { display: inline-block; }
        .submit-btn.loading { opacity: 0.8; pointer-events: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Status message */
        .status-message { display: none; align-items: center; justify-content: center; gap: 6px; margin-top: 12px; font-size: 0.9rem; font-weight: 600; }
        .status-message.show { display: flex; }
        .status-message.success { color: #4caf50; }
        .status-message.error { color: #ff4d4d; }

        @media (max-width: 480px) {
            .method-options { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="account.html" class="logo">
                <img src="images/logo-akimark.png" onerror="this.onerror=null; this.src='images/logo-akimark.jpg';" alt="Akimark Logo">
            </a>
            <div class="header-actions">
                <a href="account.html" class="back-btn">
                    <svg viewBox="0 0 24 24" width="16" height="16"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <span>BACK</span>
                </a>
            </div>
        </div>
    </header>

    <main class="container">
        <h1>Add Cash</h1>

        <!-- Amount -->
        <div class="amount-section">
            <div class="amount-label">Amount (MK)</div>
            <div class="amount-input-wrap">
                <input type="number" id="amount" placeholder="0" min="1" step="any">
                <span class="currency">MK</span>
            </div>
        </div>

        <!-- Deposit Method -->
        <div class="method-section">
            <div class="method-label">Deposit Method</div>
            <div class="method-options">
                <div class="method-card" data-method="airtel" onclick="selectMethod('airtel')">
                    <img src="images/airtel2.jpg" alt="Airtel Money">
                    <div class="method-name">Airtel Money</div>
                </div>
                <div class="method-card" data-method="tnm" onclick="selectMethod('tnm')">
                    <img src="images/tnm1.jpg" alt="TNM Mpamba">
                    <div class="method-name">TNM Mpamba</div>
                </div>
            </div>
        </div>

        <!-- Submit -->
        <button class="submit-btn" id="submitBtn" onclick="submitDeposit()">
            <span class="btn-spinner"></span>
            <span id="submitText">Deposit</span>
        </button>

        <!-- Status -->
        <div id="statusMessage" class="status-message"></div>
    </main>

    <script src="deposit.js"></script>
</body>
</html>
