<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Admin Dashboard — Akimark</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --bg-base: #0B0F19; --bg-surface: #111827; --bg-input: #1F2937; --text-main: #F9FAFB; --text-muted: #9CA3AF;
            --border-color: #1F2937; --accent-primary: #E11D48; --accent-hover: #BE123C; --radius-md: 6px; --radius-lg: 10px; --sidebar-width: 250px;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg-base); color: var(--text-main); font-size: 0.85rem; margin: 0; }
        .admin-header { background: #000; border-bottom: 1px solid var(--border-color); padding: 10px 16px; display: flex; justify-content: space-between; position: sticky; top: 0; z-index: 1000; }
        .hamburger-btn { background: none; border: none; color: var(--text-muted); font-size: 1.3rem; cursor: pointer; }
        .admin-name { font-size: 0.7rem; color: var(--text-muted); }
        .sidebar { position: fixed; top: 0; left: 0; height: 100%; width: var(--sidebar-width); background: #000; transform: translateX(-100%); transition: transform 0.3s; z-index: 1002; padding: 20px; }
        .sidebar.open { transform: translateX(0); }
        .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1001; display: none; }
        .sidebar-overlay.visible { display: block; }
        .sidebar-links { list-style: none; padding: 0; }
        .sidebar-links a { color: var(--text-muted); text-decoration: none; display: flex; gap: 10px; padding: 10px; border-radius: 6px; }
        .sidebar-links a.active { background: rgba(225,29,72,0.1); color: var(--accent-primary); }
        .main-content { max-width: 900px; margin: 20px auto; padding: 0 16px; }
        .dashboard-card { background: var(--bg-surface); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 20px; border: 1px solid var(--border-color); }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
        .stat-card { background: var(--bg-input); border-radius: 6px; padding: 16px; border: 1px solid var(--border-color); }
        .stat-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }
        .stat-value { font-size: 1.3rem; font-weight: 700; color: var(--text-main); }
        .stat-value.currency { color: var(--accent-primary); }
        .withdraw-btn { width: 100%; padding: 12px; background: var(--accent-primary); border: none; border-radius: 6px; color: #fff; font-weight: 600; margin-top: 10px; }
        .films-table { width: 100%; border-collapse: collapse; }
        .films-table th, .films-table td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 0.8rem; }
        .films-table th { color: var(--text-muted); }
        .action-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; }
        .action-btn.delete:hover { color: #ff4d6d; }
        @media (max-width: 768px) { .stats-grid { grid-template-columns: 1fr; } .films-table { display: block; overflow-x: auto; } }
    </style>
</head>
<body>

    <header class="admin-header">
        <button class="hamburger-btn" id="hamburgerBtn"><i class="bi bi-list"></i></button>
        <span id="adminNameBadge" class="admin-name">Hi, Admin</span>
    </header>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <nav class="sidebar" id="sidebar">
        <div class="d-flex justify-content-between mb-4"><span>Main Menu</span><button id="closeSidebar" style="background:none;border:none;color:#fff;"><i class="bi bi-x-lg"></i></button></div>
        <ul class="sidebar-links">
            <li><a href="admin-dashboard.html" class="active"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a></li>
            <li><a href="admin-manage.html"><i class="bi bi-cloud-arrow-up-fill"></i> Upload Film</a></li>
            <li><a href="admin-account.html"><i class="bi bi-gear-fill"></i> Settings</a></li>
        </ul>
    </nav>

    <div class="main-content">
        <!-- 1. Stats -->
        <div class="dashboard-card">
            <h2><i class="bi bi-speedometer2"></i> Financial Overview</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Available Balance</div>
                    <div class="stat-value currency" id="availableBalance">MWK 0.00</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Income (All Time)</div>
                    <div class="stat-value currency" id="totalIncome">MWK 0.00</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Pending Withdrawals</div>
                    <div class="stat-value currency" id="pendingWithdrawals">MWK 0.00</div>
                </div>
            </div>
            <button class="withdraw-btn" id="withdrawBtn"><i class="bi bi-cash-stack"></i> Withdraw Funds</button>
        </div>

        <!-- 2. Films List (Transparency) -->
        <div class="dashboard-card">
            <h2><i class="bi bi-film"></i> Your Films & Earnings</h2>
            <table class="films-table" id="filmsTable">
                <thead><tr><th>Title</th><th>Episode</th><th>Price</th><th>Earnings</th><th>Actions</th></tr></thead>
                <tbody id="filmsTableBody"></tbody>
            </table>
            <div id="noFilms" class="text-center" style="display:none; color: var(--text-muted); padding: 20px;">No films uploaded yet.</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../javascript.js/supabase.js"></script>
    <script src="admin-dashboard.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var sidebar = document.getElementById('sidebar');
            var overlay = document.getElementById('sidebarOverlay');
            document.getElementById('hamburgerBtn').addEventListener('click', function() { sidebar.classList.add('open'); overlay.classList.add('visible'); });
            document.getElementById('closeSidebar').addEventListener('click', function() { sidebar.classList.remove('open'); overlay.classList.remove('visible'); });
            overlay.addEventListener('click', function() { sidebar.classList.remove('open'); overlay.classList.remove('visible'); });
        });
    </script>
</body>
</html>
