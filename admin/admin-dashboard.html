<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Admin Dashboard — Akimark</title>
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #080808;
            --bg-surface: #151515;
            --bg-secondary: #1C1C1C;
            --accent: #c71515;
            --accent-soft: #a00f0f;
            --white: #FFFFFF;
            --text-muted: #A7A7A7;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --radius: 12px;
            --radius-sm: 8px;
            --radius-lg: 20px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            --transition: 0.25s cubic-bezier(0.2, 0, 0, 1);
        }

        html {
            font-size: 16px;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
            background: var(--bg-primary);
            color: var(--white);
            line-height: 1.6;
            min-height: 100vh;
        }

        a { color: inherit; text-decoration: none; }
        button { cursor: pointer; font-family: inherit; border: none; background: none; color: inherit; }
        input, select, textarea { font-family: inherit; border: none; outline: none; background: none; color: inherit; }
        img { display: block; max-width: 100%; }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 16px; }

        /* Header */
        .header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(8, 8, 8, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-subtle);
            padding: 12px 0;
        }
        .header .container { display: flex; align-items: center; justify-content: space-between; }
        .logo img { height: 40px; width: auto; object-fit: contain; }
        .desktop-nav { display: none; align-items: center; gap: 28px; }
        .desktop-nav a { font-size: 0.95rem; font-weight: 500; color: var(--text-muted); transition: color var(--transition); }
        .desktop-nav a:hover, .desktop-nav a.active { color: var(--white); }
        .header-actions { display: flex; align-items: center; gap: 8px; }
        .btn-accent {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            background: var(--accent); color: #fff; font-weight: 700; font-size: 0.85rem;
            padding: 6px 16px; border-radius: 8px; transition: background var(--transition), transform var(--transition);
            border: none; text-decoration: none;
        }
        .btn-accent:hover { background: var(--accent-soft); transform: scale(1.02); }
        .btn-secondary {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            background: var(--bg-secondary); color: var(--white); font-weight: 700; font-size: 0.85rem;
            padding: 6px 16px; border-radius: 8px; transition: background var(--transition), transform var(--transition);
            border: 1px solid var(--border-subtle); text-decoration: none;
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.08); transform: scale(1.02); }

        /* Dashboard */
        .dashboard { padding: 24px 0 120px; max-width: 1000px; margin: 0 auto; }

        /* Welcome Card */
        .welcome-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .welcome-avatar {
            width: 64px; height: 64px; border-radius: 50%;
            background: var(--bg-secondary); border: 2px solid var(--accent);
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .welcome-avatar svg { width: 32px; height: 32px; fill: var(--text-muted); }
        .welcome-text h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 4px; }
        .welcome-text p { color: var(--text-muted); font-size: 0.95rem; }

        /* Stats */
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 24px; }
        .stat-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius);
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .stat-icon { width: 40px; height: 40px; border-radius: 50%; background: rgba(199,21,21,0.15); display: flex; align-items: center; justify-content: center; }
        .stat-icon svg { width: 20px; height: 20px; fill: var(--accent); }
        .stat-info { flex: 1; }
        .stat-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
        .stat-value { font-size: 1.3rem; font-weight: 700; }

        /* Upload Form */
        .upload-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin-bottom: 24px;
        }
        .upload-card h2 { font-size: 1.3rem; font-weight: 700; margin-bottom: 20px; }

        .form-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg-secondary);
            border: 1.5px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            color: var(--white);
            font-size: 0.95rem;
            transition: border var(--transition);
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus { border-color: var(--accent); }
        .form-group textarea { min-height: 80px; resize: vertical; }

        .btn-submit {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: 700;
            background: var(--accent);
            color: #fff;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: background var(--transition), transform var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-submit:hover { background: var(--accent-soft); transform: scale(1.01); }
        .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; }

        /* Progress & Upload */
        .upload-progress {
            margin-top: 20px;
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
            padding: 16px;
            display: none;
        }
        .upload-progress.visible { display: block; }
        .progress-label { font-size: 0.9rem; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .progress-bar-bg { height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            transition: width 0.3s ease;
            border-radius: 4px;
            position: relative;
        }
        .progress-bar-fill::after {
            content: '';
            position: absolute;
            left: 0; right: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 1s infinite;
        }
        @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

        .success-circle {
            display: inline-flex;
            width: 20px; height: 20px;
            border-radius: 50%;
            background: var(--accent);
            align-items: center;
            justify-content: center;
            margin-left: 8px;
        }
        .success-circle svg { width: 14px; height: 14px; fill: #fff; }

        /* Recent Uploads */
        .recent-uploads { margin-top: 24px; }
        .recent-uploads h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 16px; }
        .upload-item {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .upload-item .check-circle {
            width: 24px; height: 24px;
            border-radius: 50%;
            background: #2ecc71;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .upload-item .check-circle svg { width: 16px; height: 16px; fill: #fff; }
        .upload-item .title { flex: 1; font-weight: 600; }
        .upload-item .time { font-size: 0.8rem; color: var(--text-muted); }

        /* Responsive */
        @media (min-width: 700px) {
            .form-grid { grid-template-columns: repeat(2, 1fr); }
            .stats-grid { grid-template-columns: repeat(4, 1fr); }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="logo">
                <img src="../images/logo-akimark.png" onerror="this.onerror=null; this.src='../images/logo-akimark.jpg';" alt="Akimark Logo">
            </div>
            <nav class="desktop-nav">
                <a href="../index.html">Home</a>
                <a href="../index.html#movies">Movies</a>
                <a href="../index.html#series">Series</a>
                <a href="../index.html#categories">Categories</a>
            </nav>
            <div class="header-actions">
                <a href="admin-login.html" class="btn-secondary">Logout</a>
            </div>
        </div>
    </header>

    <!-- Dashboard -->
    <div class="dashboard container">
        <!-- Welcome -->
        <div class="welcome-card">
            <div class="welcome-avatar">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
            <div class="welcome-text">
                <h1 id="adminGreeting">HELLO, Admin</h1>
                <p id="adminEmail">admin@akimark.com</p>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg></div>
                <div class="stat-info">
                    <div class="stat-label">Total Films</div>
                    <div class="stat-value" id="totalFilms">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div>
                <div class="stat-info">
                    <div class="stat-label">Admin Name</div>
                    <div class="stat-value" id="adminName">—</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3z"/></svg></div>
                <div class="stat-info">
                    <div class="stat-label">Wallet Balance</div>
                    <div class="stat-value" id="walletBalance">MK 0.00</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.11 0-2 .89-2 2v12c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/></svg></div>
                <div class="stat-info">
                    <div class="stat-label">Email</div>
                    <div class="stat-value" id="adminEmailStat">—</div>
                </div>
            </div>
        </div>

        <!-- Upload Film -->
        <div class="upload-card">
            <h2>Upload New Film</h2>
            <form id="uploadFilmForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" id="filmTitle" required>
                    </div>
                    <div class="form-group">
                        <label>Genre</label>
                        <select id="filmGenre" required>
                            <option value="">Select Genre</option>
                            <option value="actions">Actions</option>
                            <option value="indian">Indian</option>
                            <option value="koreans">Koreans</option>
                            <option value="comedy">Comedy</option>
                            <option value="thriller">Thriller</option>
                            <option value="music">Music</option>
                            <option value="local">Local</option>
                            <option value="scifi">Sci-Fi</option>
                            <option value="drama">Drama</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Year</label>
                        <input type="number" id="filmYear" min="1900" max="2100" required>
                    </div>
                    <div class="form-group">
                        <label>Duration (minutes)</label>
                        <input type="number" id="filmDuration" min="1" required>
                    </div>
                    <div class="form-group">
                        <label>Quality</label>
                        <select id="filmQuality">
                            <option value="HD">HD</option>
                            <option value="4K">4K</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Price (MK)</label>
                        <input type="number" id="filmPrice" min="0" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label>Poster URL</label>
                        <input type="url" id="filmPosterUrl" required>
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <input type="text" id="filmCategory" placeholder="e.g. actions" required>
                    </div>
                    <div class="form-group">
                        <label>Featured?</label>
                        <select id="filmFeatured">
                            <option value="false">No</option>
                            <option value="true">Yes</option>
                        </select>
                    </div>
                    <div class="form-group" style="grid-column: 1 / -1;">
                        <label>Description</label>
                        <textarea id="filmDescription" placeholder="Short description of the film..."></textarea>
                    </div>
                </div>
                <button type="submit" class="btn-submit" id="uploadBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                    Upload Film
                </button>
            </form>

            <!-- Upload Progress -->
            <div class="upload-progress" id="uploadProgress">
                <div class="progress-label">
                    <span id="progressText">Uploading...</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressBar" style="width: 0%;"></div>
                </div>
            </div>
        </div>

        <!-- Recent Uploads -->
        <div class="recent-uploads">
            <h2>Recent Uploads</h2>
            <div id="recentUploadsList">
                <p style="color: var(--text-muted); font-size: 0.9rem;">No uploads yet.</p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../javascript.js/supabase.js"></script>
    <script src="admin-dashboard.js"></script>
</body>
</html>
