<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Admin Dashboard — Akimark</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #080808;
            --surface: #151515;
            --secondary: #1C1C1C;
            --accent: #c71515;
            --white: #fff;
            --muted: #A7A7A7;
            --border: rgba(255,255,255,0.08);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--white);
            padding-bottom: 90px;
        }
        .header {
            background: rgba(8,8,8,0.95);
            border-bottom: 1px solid var(--border);
            padding: 14px 16px;
        }
        .logo img {
            height: 40px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 16px;
        }
        .welcome-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--secondary);
            border: 2px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .avatar svg {
            width: 30px;
            fill: var(--muted);
        }
        .greeting h1 {
            font-size: 1.5rem;
            font-weight: 800;
        }
        .greeting p {
            color: var(--muted);
            font-size: 0.9rem;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }
        .stat-label {
            font-size: 0.75rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .stat-value {
            font-size: 1.6rem;
            font-weight: 800;
        }
        .performance-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .performance-card h2 {
            font-size: 1.1rem;
            margin-bottom: 20px;
        }
        .chart {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            height: 200px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }
        .bar {
            flex: 1;
            background: linear-gradient(to top, var(--accent), #ff4d4d);
            border-radius: 6px 6px 0 0;
            min-height: 10px;
            position: relative;
        }
        .bar-label {
            font-size: 0.65rem;
            color: var(--muted);
            text-align: center;
            margin-top: 8px;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(8,8,8,0.96);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 200;
        }
        .bottom-nav a {
            color: var(--muted);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.7rem;
            gap: 4px;
        }
        .bottom-nav a.active {
            color: var(--accent);
        }
        .bottom-nav svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
        @media (min-width: 700px) {
            .stats-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="logo">
                <img src="../images/logo-akimark.png" onerror="this.onerror=null; this.src='../images/logo-akimark.jpg';" alt="Akimark">
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container">
        <!-- Welcome Card -->
        <div class="welcome-card">
            <div class="avatar">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
            <div class="greeting">
                <h1 id="greeting">HELLO, ADMIN</h1>
                <p id="adminEmail">admin@akimark.com</p>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Films</div>
                <div class="stat-value" id="totalFilms">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Admin Name</div>
                <div class="stat-value" id="adminName">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Wallet Balance</div>
                <div class="stat-value" id="walletBalance">MK 0.00</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Email</div>
                <div class="stat-value" id="adminEmailStat">—</div>
            </div>
        </div>

        <!-- Performance Graph -->
        <div class="performance-card">
            <h2>Performance (Last 7 Days)</h2>
            <div class="chart">
                <div class="bar" style="height: 50%;"><div class="bar-label">Mon</div></div>
                <div class="bar" style="height: 70%;"><div class="bar-label">Tue</div></div>
                <div class="bar" style="height: 40%;"><div class="bar-label">Wed</div></div>
                <div class="bar" style="height: 90%;"><div class="bar-label">Thu</div></div>
                <div class="bar" style="height: 60%;"><div class="bar-label">Fri</div></div>
                <div class="bar" style="height: 30%;"><div class="bar-label">Sat</div></div>
                <div class="bar" style="height: 80%;"><div class="bar-label">Sun</div></div>
            </div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
        <a href="admin-dashboard.html" class="active">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            Home
        </a>
        <a href="admin-manage.html">
            <svg viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-2z"/></svg>
            Manage
        </a>
        <a href="admin-account.html">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            Account
        </a>
    </nav>

    <script src="../javascript.js/supabase.js"></script>
    <script src="admin-dashboard.js"></script>
</body>
</html>
