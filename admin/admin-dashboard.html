<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Admin Dashboard — Akimark</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        :root {
            --bg-base: #0B0F19;
            --bg-surface: #111827;
            --bg-input: #1F2937;
            --bg-input-hover: #374151;
            --text-main: #F9FAFB;
            --text-muted: #9CA3AF;
            --border-color: #1F2937;
            --border-focus: #374151;
            --accent-primary: #E11D48;
            --accent-hover: #BE123C;
            --accent-glow: rgba(225, 29, 72, 0.2);
            --radius-md: 6px;
            --radius-lg: 10px;
            --sidebar-width: 250px;
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            font-size: 0.85rem;
        }

        /* Header */
        .admin-header {
            background: #000;
            border-bottom: 1px solid var(--border-color);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .admin-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .hamburger-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.3rem;
            cursor: pointer;
            padding: 4px;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }
        .hamburger-btn:hover {
            color: var(--text-main);
            background: rgba(255,255,255,0.1);
        }
        .admin-logo img {
            height: 30px;
            width: auto;
            border-radius: 4px;
        }
        .admin-name {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Sidebar */
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 1001;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .sidebar-overlay.visible {
            display: block;
            opacity: 1;
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            width: var(--sidebar-width);
            background: #000;
            border-right: 1px solid var(--border-color);
            z-index: 1002;
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
        }
        .sidebar.open {
            transform: translateX(0);
        }
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }
        .sidebar-header span {
            font-weight: 700;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }
        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1rem;
            cursor: pointer;
        }
        .close-btn:hover { color: var(--text-main); }
        .sidebar-links {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .sidebar-links li { margin-bottom: 4px; }
        .sidebar-links a {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
            text-decoration: none;
            padding: 10px 12px;
            border-radius: var(--radius-md);
            font-weight: 500;
            font-size: 0.8rem;
            transition: var(--transition-smooth);
        }
        .sidebar-links a:hover {
            background: var(--bg-input);
            color: var(--text-main);
        }
        .sidebar-links a.active {
            background: rgba(225, 29, 72, 0.1);
            color: var(--accent-primary);
            position: relative;
        }
        .sidebar-links a.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 20%;
            height: 60%;
            width: 4px;
            background: var(--accent-primary);
            border-radius: 0 4px 4px 0;
        }

        /* Main Content */
        .main-content {
            max-width: 850px;
            margin: 20px auto;
            padding: 0 16px;
        }
        .dashboard-card {
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            padding: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 24px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        .dashboard-card h2 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .dashboard-card h2 i {
            color: var(--accent-primary);
            background: rgba(225, 29, 72, 0.1);
            padding: 6px;
            border-radius: 8px;
            font-size: 1rem;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: var(--bg-input);
            border-radius: var(--radius-md);
            padding: 16px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-md);
            background: rgba(225, 29, 72, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .stat-icon i {
            font-size: 1.2rem;
            color: var(--accent-primary);
        }
        .stat-info {
            flex: 1;
        }
        .stat-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }
        .stat-value {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-main);
        }
        .stat-value.currency {
            color: var(--accent-primary);
        }

        /* Withdraw Button */
        .withdraw-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent-primary);
            border: none;
            border-radius: var(--radius-md);
            color: #fff;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: var(--transition-smooth);
            margin-top: 10px;
        }
        .withdraw-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        /* Films Table */
        .films-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }
        .films-table th,
        .films-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.8rem;
        }
        .films-table th {
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.7rem;
        }
        .films-table td {
            color: var(--text-main);
        }
        .films-table .action-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            font-size: 1rem;
            transition: color 0.3s;
        }
        .films-table .action-btn:hover {
            color: var(--accent-primary);
        }
        .films-table .action-btn.delete:hover {
            color: #ff4d6d;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .films-table {
                display: block;
                overflow-x: auto;
                white-space: nowrap;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="admin-header">
        <div class="admin-header-left">
            <button class="hamburger-btn" id="hamburgerBtn"><i class="bi bi-list"></i></button>
            <div class="admin-logo">
                <img src="../images/logo-akimark.png" onerror="this.style.display='none'; document.getElementById('logoText').style.display='block';" alt="Akimark">
                <span id="logoText" style="display:none; font-weight:800; font-size:1rem;">Aki<span style="color:var(--accent-primary)">MARK</span></span>
            </div>
        </div>
        <span id="adminNameBadge" class="admin-name">Hi, Admin</span>
    </header>

    <!-- Sidebar -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span>Main Menu</span>
            <button class="close-btn" id="closeSidebar"><i class="bi bi-x-lg"></i></button>
        </div>
        <ul class="sidebar-links">
            <li><a href="admin-dashboard.html" class="active"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a></li>
            <li><a href="admin-manage.html"><i class="bi bi-cloud-arrow-up-fill"></i> Upload Film</a></li>
            <li><a href="admin-account.html"><i class="bi bi-gear-fill"></i> Settings</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Stats -->
        <div class="dashboard-card">
            <h2><i class="bi bi-speedometer2"></i> Quick Stats</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon"><i class="bi bi-wallet2"></i></div>
                    <div class="stat-info">
                        <div class="stat-label">Wallet Balance</div>
                        <div class="stat-value currency" id="walletBalance">MWK 0.00</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="bi bi-film"></i></div>
                    <div class="stat-info">
                        <div class="stat-label">Total Films</div>
                        <div class="stat-value" id="totalFilms">0</div>
                    </div>
                </div>
            </div>
            <button class="withdraw-btn" id="withdrawBtn">
                <i class="bi bi-cash-stack"></i> Withdraw Funds
            </button>
        </div>

        <!-- Films List -->
        <div class="dashboard-card">
            <h2><i class="bi bi-film"></i> Your Films & Earnings</h2>
            <table class="films-table" id="filmsTable">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Price</th>
                        <th>Earnings</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="filmsTableBody">
                    <!-- Films will be injected here -->
                </tbody>
            </table>
            <div id="noFilms" class="text-center" style="display:none; color: var(--text-muted); padding: 20px;">
                No films uploaded yet.
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../javascript.js/supabase.js"></script>
    <script src="admin-dashboard.js"></script>
</body>
</html>
