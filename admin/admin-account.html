<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Admin Account — Akimark</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #080808;
            --surface: #151515;
            --secondary: #1C1C1C;
            --accent: #c71515;
            --white: #fff;
            --muted: #A7A7A7;
            --border: rgba(255,255,255,0.08);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--white);
            padding-bottom: 90px;
        }
        .header {
            background: rgba(8,8,8,0.95);
            border-bottom: 1px solid var(--border);
            padding: 14px 16px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px 16px;
        }
        .account-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
        }
        .account-header {
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
            margin-bottom: 20px;
        }
        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--secondary);
            border: 2px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .avatar svg {
            width: 30px;
            fill: var(--muted);
        }
        .info h2 {
            font-size: 1.2rem;
        }
        .info p {
            color: var(--muted);
        }
        .detail {
            margin-bottom: 16px;
        }
        .detail-label {
            font-size: 0.75rem;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .detail-value {
            background: var(--secondary);
            padding: 12px 14px;
            border-radius: 8px;
            font-weight: 600;
        }
        .logout-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
        }
        .logout-btn:hover {
            background: #a00f0f;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(8,8,8,0.96);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 200;
        }
        .bottom-nav a {
            color: var(--muted);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.7rem;
            gap: 4px;
        }
        .bottom-nav a.active {
            color: var(--accent);
        }
        .bottom-nav svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="logo">
                <img src="../images/logo-akimark.png" onerror="this.onerror=null; this.src='../images/logo-akimark.jpg';" alt="Akimark">
            </div>
        </div>
    </header>

    <!-- Account Content -->
    <div class="container">
        <div class="account-card">
            <div class="account-header">
                <div class="avatar">
                    <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                </div>
                <div class="info">
                    <h2 id="adminName">Admin Name</h2>
                    <p id="adminEmail">email@example.com</p>
                </div>
            </div>

            <div class="detail">
                <div class="detail-label">Full Name</div>
                <div class="detail-value" id="fullName">—</div>
            </div>
            <div class="detail">
                <div class="detail-label">Email</div>
                <div class="detail-value" id="email">—</div>
            </div>
            <div class="detail">
                <div class="detail-label">Total Films</div>
                <div class="detail-value" id="totalFilms">0</div>
            </div>
            <div class="detail">
                <div class="detail-label">Wallet Balance</div>
                <div class="detail-value" id="walletBalance">MK 0.00</div>
            </div>

            <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
        <a href="admin-dashboard.html">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            Home
        </a>
        <a href="admin-manage.html">
            <svg viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-2z"/></svg>
            Manage
        </a>
        <a href="admin-account.html" class="active">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            Account
        </a>
    </nav>

    <script src="../javascript.js/supabase.js"></script>
    <script src="admin-account.js"></script>
</body>
</html>
