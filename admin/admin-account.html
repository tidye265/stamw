<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Account — Akimark Admin</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0B0F19;
            color: #F9FAFB;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .coming-soon {
            text-align: center;
            padding: 40px;
            background: #111827;
            border-radius: 12px;
            border: 1px solid #1F2937;
            box-shadow: 0 4px 24px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 90%;
        }
        .coming-soon i {
            font-size: 3rem;
            color: #E11D48;
            margin-bottom: 16px;
            display: block;
        }
        .coming-soon h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .coming-soon p {
            color: #9CA3AF;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="coming-soon">
        <i class="bi bi-hourglass-split"></i>
        <h1>Coming Soon</h1>
        <p>Tsopano akupanga account page. Mukhoza kubwerera mmawa.</p>
    </div>

</body>
</html>
