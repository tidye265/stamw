<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Manage Films — Akimark Admin</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        /* ===== ROOT VARIABLES ===== */
        :root {
            --bg-black: #000000;
            --bg-dark: #111111;
            --bg-card: #1C1C1C;
            --bg-input: #2A2A2A;
            --bg-grey: #f8f9fa;
            --text-white: #ffffff;
            --text-grey: #A7A7A7;
            --border-dark: #333333;
            --accent: #c71515;
            --accent-soft: #a00f0f;
            --radius: 12px;
            --sidebar-width: 280px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-black);
            color: var(--text-white);
            min-height: 100vh;
        }

        /* ===== HEADER ===== */
        .admin-header {
            background: var(--bg-black);
            border-bottom: 1px solid var(--border-dark);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .admin-header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .hamburger-btn {
            background: none;
            border: none;
            color: var(--text-white);
            font-size: 1.8rem;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }
        .admin-logo img {
            height: 40px;
            width: auto;
        }
        .admin-title {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-white);
        }
        .admin-user-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-grey);
            font-size: 0.85rem;
        }
        .admin-user-badge i {
            font-size: 1.3rem;
        }

        /* ===== SIDEBAR MENU ===== */
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1001;
            display: none;
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            width: var(--sidebar-width);
            background: var(--bg-dark);
            border-right: 1px solid var(--border-dark);
            z-index: 1002;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            padding: 20px;
        }
        .sidebar.open {
            transform: translateX(0);
        }
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .sidebar-header .close-btn {
            background: none;
            border: none;
            color: var(--text-grey);
            font-size: 1.5rem;
            cursor: pointer;
        }
        .sidebar-links {
            list-style: none;
            padding: 0;
        }
        .sidebar-links li {
            margin-bottom: 10px;
        }
        .sidebar-links a {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-white);
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 8px;
            transition: background 0.3s;
        }
        .sidebar-links a:hover {
            background: var(--bg-card);
        }
        .sidebar-links a.active {
            background: var(--accent);
            color: #fff;
        }
        .sidebar-links i {
            font-size: 1.2rem;
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            max-width: 1000px;
            margin: 24px auto;
            padding: 0 16px;
        }
        .upload-card {
            background: var(--bg-grey);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .upload-card h2 {
            font-size: 1.4rem;
            font-weight: 800;
            color: #000;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .upload-card h2 i {
            color: var(--accent);
        }
        .form-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .form-control, .form-select {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            color: #333;
            padding: 10px 12px;
            font-size: 0.95rem;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 0.25rem rgba(199,21,21,0.1);
            background: #fff;
            color: #333;
        }
        .file-drop {
            border: 2px dashed #ccc;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #fff;
        }
        .file-drop:hover {
            border-color: var(--accent);
            background: #f0f0f0;
        }
        .file-drop i {
            font-size: 2.5rem;
            color: var(--accent);
            display: block;
            margin-bottom: 10px;
        }
        .file-drop p {
            color: #666;
            margin: 0;
            font-size: 0.9rem;
        }
        .file-drop input[type="file"] {
            display: none;
        }
        .preview {
            margin-top: 12px;
            display: none;
        }
        .preview img {
            max-width: 200px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.3s;
        }
        .btn-submit:hover {
            background: var(--accent-soft);
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* ===== PROGRESS BAR (Pro Level) ===== */
        .progress-wrap {
            margin-top: 20px;
            display: none;
        }
        .progress-wrap.visible {
            display: block;
        }
        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #333;
        }
        .progress-bar-bg {
            height: 12px;
            background: #e0e0e0;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), #ff4d4d);
            transition: width 0.3s;
            border-radius: 6px;
        }
        .progress-bar-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 1s infinite;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* ===== LOADING SPINNER ===== */
        .spinner-border-sm {
            width: 1.2rem;
            height: 1.2rem;
            border-width: 0.2em;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 576px) {
            .main-content { padding: 0 12px; }
            .upload-card { padding: 16px; }
            .admin-title { font-size: 1rem; }
            .admin-user-badge { display: none; }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="admin-header">
        <div class="admin-header-left">
            <button class="hamburger-btn" id="hamburgerBtn">
                <i class="bi bi-list"></i>
            </button>
            <div class="admin-logo">
                <img src="../images/logo-akimark.png" onerror="this.onerror=null; this.src='../images/logo-akimark.jpg';" alt="Akimark">
            </div>
            <div class="admin-title">
                <i class="bi bi-shield-lock me-2"></i>ADMIN DASHBOARD
            </div>
        </div>
        <div class="admin-user-badge">
            <i class="bi bi-person-circle"></i>
            <span id="adminNameBadge">Admin</span>
        </div>
    </header>

    <!-- ===== SIDEBAR ===== -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span style="font-weight: 700; font-size: 1.1rem;">Menu</span>
            <button class="close-btn" id="closeSidebar"><i class="bi bi-x-lg"></i></button>
        </div>
        <ul class="sidebar-links">
            <li><a href="admin-dashboard.html"><i class="bi bi-house-door-fill"></i> Home</a></li>
            <li><a href="admin-manage.html" class="active"><i class="bi bi-cloud-arrow-up-fill"></i> Upload</a></li>
            <li><a href="admin-account.html"><i class="bi bi-person-fill"></i> Account & Settings</a></li>
        </ul>
    </nav>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="main-content">
        <div class="upload-card">
            <h2>
                <i class="bi bi-cloud-arrow-up"></i>
                Upload Film
            </h2>
            <form id="uploadFilmForm">
                <!-- Operation Selection -->
                <div class="row g-3 mb-3">
                    <div class="col-12 col-md-6">
                        <label class="form-label" for="operation">Operation</label>
                        <select class="form-select" id="operation" required>
                            <option value="new">New Film</option>
                            <option value="continue">Continue Film</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-6" id="filmListContainer" style="display: none;">
                        <label class="form-label" for="existingFilm">Select Film</label>
                        <select class="form-select" id="existingFilm">
                            <!-- Films will be loaded here -->
                        </select>
                    </div>
                </div>

                <!-- Film Details -->
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label" for="filmTitle">Film Title</label>
                        <input type="text" class="form-control" id="filmTitle" required>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label" for="filmGenre">Genre</label>
                        <select class="form-select" id="filmGenre" required>
                            <option value="">Select Genre</option>
                            <option value="actions">Actions</option>
                            <option value="indian">Indian</option>
                            <option value="koreans">Koreans</option>
                            <option value="comedy">Comedy</option>
                            <option value="thriller">Thriller</option>
                            <option value="music">Music</option>
                            <option value="local">Local</option>
                            <option value="drama">Drama</option>
                            <option value="scifi">Sci-Fi</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label" for="filmYear">Year</label>
                        <input type="number" class="form-control" id="filmYear" min="1900" max="2100" required>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label" for="filmDuration">Duration (min)</label>
                        <input type="number" class="form-control" id="filmDuration" min="1" required>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label" for="filmPrice">Price (MK)</label>
                        <input type="number" class="form-control" id="filmPrice" min="0" step="0.01" required>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label" for="filmCategory">Category</label>
                        <input type="text" class="form-control" id="filmCategory" placeholder="e.g. actions" required>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label" for="filmFeatured">Featured</label>
                        <select class="form-select" id="filmFeatured">
                            <option value="false">No</option>
                            <option value="true">Yes</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="filmDescription">Description</label>
                        <textarea class="form-control" id="filmDescription" rows="3"></textarea>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="posterFile">Poster Image</label>
                        <div class="file-drop" id="fileDrop">
                            <i class="bi bi-image"></i>
                            <p>Tap to upload poster image</p>
                            <input type="file" id="posterFile" accept="image/*" hidden>
                        </div>
                        <div class="preview" id="preview">
                            <img id="previewImg" alt="Preview">
                        </div>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="videoFile">Film Video</label>
                        <div class="file-drop" id="videoDrop">
                            <i class="bi bi-play-circle"></i>
                            <p>Tap to upload film video</p>
                            <input type="file" id="videoFile" accept="video/*" hidden>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="uploadBtn">
                    <span class="spinner-border spinner-border-sm" id="btnSpinner" style="display: none;"></span>
                    <i class="bi bi-cloud-arrow-up-fill" id="btnIcon"></i>
                    <span id="btnText">Upload to Cloudflare</span>
                </button>
            </form>

            <!-- Progress -->
            <div class="progress-wrap" id="progressWrap">
                <div class="progress-label">
                    <span id="progressText">Uploading...</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressFill"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Our scripts -->
    <script src="../javascript.js/supabase.js"></script>
    <script src="admin-manage.js"></script>
</body>
</html>
