<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Manage Films — Akimark</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: #080808;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding-bottom: 80px; /* space for bottom nav */
        }
        .header {
            background: rgba(8,8,8,0.95);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding: 10px 0;
        }
        .header .logo img {
            height: 40px;
        }
        .admin-name-bar {
            background: #151515;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding: 8px 16px;
            text-align: center;
            font-size: 0.9rem;
            color: #A7A7A7;
        }
        .admin-name-bar strong {
            color: #fff;
        }
        .page-title {
            font-weight: 800;
            margin-top: 20px;
            margin-bottom: 20px;
        }
        .upload-card {
            background: #151515;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 24px;
        }
        .form-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #A7A7A7;
            margin-bottom: 6px;
        }
        .form-control, .form-select {
            background: #1C1C1C;
            border: 1px solid rgba(255,255,255,0.08);
            color: #fff;
            border-radius: 8px;
            padding: 12px 14px;
        }
        .form-control:focus, .form-select:focus {
            background: #1C1C1C;
            border-color: #c71515;
            box-shadow: 0 0 0 0.25rem rgba(199,21,21,0.25);
            color: #fff;
        }
        .file-drop {
            border: 2px dashed rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        .file-drop:hover {
            border-color: #c71515;
        }
        .file-drop svg {
            width: 40px;
            height: 40px;
            fill: #A7A7A7;
            margin-bottom: 10px;
        }
        .file-drop p {
            color: #A7A7A7;
            margin: 0;
        }
        .preview {
            margin-top: 12px;
            display: none;
        }
        .preview img {
            max-width: 200px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #c71515;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
        }
        .btn-submit:hover {
            background: #a00f0f;
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .progress-wrap {
            margin-top: 16px;
            display: none;
        }
        .progress-wrap.visible {
            display: block;
        }
        .progress-bar {
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: #c71515;
            transition: width 0.3s;
        }
        .progress-text {
            font-size: 0.85rem;
            color: #A7A7A7;
            margin-top: 8px;
            text-align: center;
        }
        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(8,8,8,0.96);
            border-top: 1px solid rgba(255,255,255,0.08);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 200;
        }
        .bottom-nav a {
            color: #A7A7A7;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.7rem;
            gap: 4px;
        }
        .bottom-nav a.active {
            color: #c71515;
        }
        .bottom-nav svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
        /* Mobile specific adjustments */
        @media (max-width: 576px) {
            .container {
                padding-left: 12px;
                padding-right: 12px;
            }
            .upload-card {
                padding: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="logo">
                <img src="../images/logo-akimark.png" onerror="this.onerror=null; this.src='../images/logo-akimark.jpg';" alt="Akimark">
            </div>
            <!-- Logo only, no buttons -->
        </div>
    </header>

    <!-- Admin Name Bar (under header) -->
    <div class="admin-name-bar" id="adminNameBar">
        Translating as <strong id="adminNameDisplay">—</strong>
    </div>

    <!-- Main Content -->
    <div class="container">
        <h1 class="page-title">Manage Films</h1>
        <div class="upload-card">
            <form id="uploadFilmForm">
                <div class="row g-3">
                    <div class="col-12 col-md-6">
                        <label class="form-label" for="filmTitle">Film Title</label>
                        <input type="text" class="form-control" id="filmTitle" required>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label" for="filmGenre">Genre</label>
                        <select class="form-select" id="filmGenre" required>
                            <option value="">Select Genre</option>
                            <option value="actions">Actions</option>
                            <option value="indian">Indian</option>
                            <option value="koreans">Koreans</option>
                            <option value="comedy">Comedy</option>
                            <option value="thriller">Thriller</option>
                            <option value="music">Music</option>
                            <option value="local">Local</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label" for="filmYear">Year</label>
                        <input type="number" class="form-control" id="filmYear" min="1900" max="2100" required>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label" for="filmDuration">Duration (min)</label>
                        <input type="number" class="form-control" id="filmDuration" min="1" required>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label" for="filmPrice">Price (MK)</label>
                        <input type="number" class="form-control" id="filmPrice" min="0" step="0.01" required>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label" for="filmCategory">Category</label>
                        <input type="text" class="form-control" id="filmCategory" placeholder="e.g. actions" required>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label" for="filmFeatured">Featured</label>
                        <select class="form-select" id="filmFeatured">
                            <option value="false">No</option>
                            <option value="true">Yes</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="filmDescription">Description</label>
                        <textarea class="form-control" id="filmDescription" rows="3"></textarea>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="posterFile">Poster Image (Upload)</label>
                        <div class="file-drop" id="fileDrop">
                            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                            <p>Tap to upload poster</p>
                            <input type="file" id="posterFile" accept="image/*" hidden>
                        </div>
                        <div class="preview" id="preview">
                            <img id="previewImg" alt="Preview">
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn-submit" id="uploadBtn">
                    <i class="bi bi-check-circle me-2"></i> Upload Film
                </button>
            </form>

            <!-- Progress -->
            <div class="progress-wrap" id="progressWrap">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText">Uploading...</div>
            </div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
        <a href="admin-dashboard.html">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home</span>
        </a>
        <a href="admin-manage.html" class="active">
            <svg viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-2z"/></svg>
            <span>Manage</span>
        </a>
        <a href="admin-account.html">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <span>Account</span>
        </a>
    </nav>

    <!-- Bootstrap JS (optional, but for toggle components if needed) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Our scripts -->
    <script src="../javascript.js/supabase.js"></script>
    <script src="admin-manage.js"></script>
</body>
</html>
