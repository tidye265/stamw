<!-- Copy the entire HTML from the current file, but make these changes:
1. Add `multiple` to Genre select or use checkboxes.
2. Add `episodeRange` input.
3. Add `existingFilmSearch` input.
4. Remove `required` from `filmDuration`.
5. Add Batch Queue section.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Manage Films — Akimark Admin Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root { --bg-base: #0B0F19; --bg-surface: #111827; --bg-input: #1F2937; --accent: #E11D48; --text: #F9FAFB; --muted: #9CA3AF; --border: #1F2937; --radius: 6px; --sidebar-width: 250px; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-base); color: var(--text); font-size: 0.85rem; margin: 0; }
        .admin-header { background: #000; border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; justify-content: space-between; position: sticky; top: 0; z-index: 1000; }
        .hamburger-btn { background: none; border: none; color: var(--muted); font-size: 1.3rem; cursor: pointer; }
        .admin-name { font-size: 0.7rem; color: var(--muted); }
        .sidebar { position: fixed; top: 0; left: 0; height: 100%; width: var(--sidebar-width); background: #000; transform: translateX(-100%); transition: 0.3s; z-index: 1002; padding: 20px; }
        .sidebar.open { transform: translateX(0); }
        .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1001; display: none; }
        .sidebar-overlay.visible { display: block; }
        .sidebar-links { list-style: none; padding: 0; }
        .sidebar-links a { color: var(--muted); text-decoration: none; display: flex; gap: 10px; padding: 10px; border-radius: 6px; }
        .sidebar-links a.active { background: rgba(225,29,72,0.1); color: var(--accent); }
        .main-content { max-width: 900px; margin: 20px auto; padding: 0 16px; }
        .upload-card { background: var(--bg-surface); border-radius: 10px; padding: 20px; border: 1px solid var(--border); }
        .form-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; display: block; }
        .form-control, .form-select { background: var(--bg-input); border: 1px solid transparent; border-radius: var(--radius); color: var(--text); padding: 10px; font-size: 0.85rem; }
        .file-drop { border: 1.5px dashed var(--border); border-radius: 6px; padding: 20px; text-align: center; cursor: pointer; background: var(--bg-input); }
        .btn-submit { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 6px; font-weight: 600; margin-top: 20px; }
        .batch-queue { margin-top: 20px; background: var(--bg-input); border-radius: 6px; padding: 10px; }
        .queue-item { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid var(--border); }
        .progress { height: 6px; background: #333; border-radius: 3px; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--accent); }
        .guide-btn { position: fixed; bottom: 20px; right: 20px; background: var(--accent); color: #fff; border: none; border-radius: 50%; width: 48px; height: 48px; font-size: 1.3rem; cursor: pointer; }
    </style>
</head>
<body>
    <header class="admin-header">
        <button class="hamburger-btn" id="hamburgerBtn"><i class="bi bi-list"></i></button>
        <span id="adminNameBadge" class="admin-name">Hi, Admin</span>
    </header>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <nav class="sidebar" id="sidebar">
        <div class="d-flex justify-content-between mb-4"><span>Main Menu</span><button id="closeSidebar" style="background:none;border:none;color:#fff;"><i class="bi bi-x-lg"></i></button></div>
        <ul class="sidebar-links">
            <li><a href="admin-dashboard.html"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a></li>
            <li><a href="admin-manage.html" class="active"><i class="bi bi-cloud-arrow-up-fill"></i> Upload Film</a></li>
            <li><a href="admin-account.html"><i class="bi bi-gear-fill"></i> Settings</a></li>
        </ul>
    </nav>

    <div class="main-content">
        <div class="upload-card">
            <h2><i class="bi bi-film"></i> Batch Upload Film</h2>
            <form id="uploadFilmForm">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Operation</label>
                        <select class="form-select" id="operation">
                            <option value="new">Create New Film</option>
                            <option value="continue">Update / Continue Film</option>
                        </select>
                    </div>
                    <div class="col-md-6" id="filmListContainer" style="display:none;">
                        <label class="form-label">Search Existing Film</label>
                        <input type="text" class="form-control mb-2" id="existingFilmSearch" placeholder="Type to search...">
                        <select class="form-select" id="existingFilm"></select>
                    </div>
                    
                    <div class="col-12">
                        <label class="form-label">Film Title *</label>
                        <input type="text" class="form-control" id="filmTitle" placeholder="Enter movie title..." required>
                    </div>
                    
                    <!-- 4. Multiple Genres -->
                    <div class="col-md-6">
                        <label class="form-label">Genres (Select Multiple)</label>
                        <select class="form-select" id="filmGenre" multiple>
                            <option value="Action">Action</option>
                            <option value="Romance">Romance</option>
                            <option value="Thriller">Thriller</option>
                            <option value="Comedy">Comedy</option>
                            <option value="Drama">Drama</option>
                        </select>
                    </div>
                    
                    <div class="col-md-3">
                        <label class="form-label">Release Year</label>
                        <input type="number" class="form-control" id="filmYear" placeholder="2024" required>
                    </div>
                    
                    <!-- 3. Episode Range -->
                    <div class="col-md-3">
                        <label class="form-label">Episode Range (e.g. 1-10)</label>
                        <input type="text" class="form-control" id="episodeRange" placeholder="1-10">
                    </div>
                    
                    <!-- 5. Optional Duration -->
                    <div class="col-md-6">
                        <label class="form-label">Duration (Mins) (Optional)</label>
                        <input type="number" class="form-control" id="filmDuration" placeholder="e.g. 120">
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label">Price (MWK) *</label>
                        <input type="number" class="form-control" id="filmPrice" placeholder="0.00" required>
                    </div>
                    
                    <div class="col-12">
                        <label class="form-label">Category</label>
                        <input type="text" class="form-control" id="filmCategory" placeholder="e.g. Blockbuster">
                    </div>
                    
                    <div class="col-12">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" id="filmDescription" rows="2"></textarea>
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label">Poster Artwork</label>
                        <div class="file-drop" id="fileDrop">
                            <i class="bi bi-image"></i><p>Drag & drop or click</p>
                            <input type="file" id="posterFile" accept="image/*" hidden>
                        </div>
                        <div class="preview mt-2" id="preview"><img id="previewImg" style="max-width:100px; border-radius:6px;" /></div>
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label">Video File(s) (Batch)</label>
                        <div class="file-drop" id="videoDrop">
                            <i class="bi bi-play-btn"></i><p>Select multiple videos</p>
                            <input type="file" id="videoFile" accept="video/*" multiple hidden>
                        </div>
                    </div>
                </div>
                
                <button type="submit" class="btn-submit" id="uploadBtn">
                    <span class="spinner-border spinner-border-sm" id="btnSpinner" style="display:none;"></span>
                    <i class="bi bi-hdd-network" id="btnIcon"></i>
                    <span id="btnText">Upload to Server</span>
                </button>
            </form>
            
            <!-- 2. Batch Queue Preview -->
            <div class="batch-queue" id="batchQueue" style="display:none;">
                <h6>Batch Queue (Preview)</h6>
                <div id="queueList"></div>
            </div>
            
            <div class="progress-wrap mt-3" id="progressWrap" style="display:none;">
                <div class="d-flex justify-content-between"><span id="progressText">Uploading...</span><span id="progressPercent">0%</span></div>
                <div class="progress"><div class="progress-bar" id="progressFill"></div></div>
            </div>
        </div>
    </div>

    <button class="guide-btn" id="guideBtn"><i class="bi bi-question-lg"></i></button>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../javascript.js/supabase.js"></script>
    <script src="admin-manage.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var sidebar = document.getElementById('sidebar');
            var overlay = document.getElementById('sidebarOverlay');
            document.getElementById('hamburgerBtn').addEventListener('click', function() { sidebar.classList.add('open'); overlay.classList.add('visible'); });
            document.getElementById('closeSidebar').addEventListener('click', function() { sidebar.classList.remove('open'); overlay.classList.remove('visible'); });
            overlay.addEventListener('click', function() { sidebar.classList.remove('open'); overlay.classList.remove('visible'); });
        });
    </script>
</body>
</html>
