<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Register — Akmark</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        /* ===== RESET & BASE ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #080808;
            --bg-surface: #151515;
            --bg-secondary: #1C1C1C;
            --accent: #c71515;
            --accent-soft: #a00f0f;
            --white: #FFFFFF;
            --text-muted: #A7A7A7;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --radius: 12px;
            --radius-sm: 8px;
            --radius-lg: 20px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            --transition: 0.25s cubic-bezier(0.2, 0, 0, 1);
        }

        html {
            font-size: 16px;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
            background: linear-gradient(180deg, #0a0a0a 0%, #080808 100%);
            color: var(--white);
            line-height: 1.6;
            min-height: 100vh;
        }

        a {
            color: inherit;
            text-decoration: none;
        }
        button {
            cursor: pointer;
            font-family: inherit;
            border: none;
            background: none;
            color: inherit;
        }
        input, select {
            font-family: inherit;
            border: none;
            outline: none;
            background: none;
            color: inherit;
        }
        img {
            display: block;
            max-width: 100%;
        }
        ul {
            list-style: none;
        }

        /* ===== HEADER ===== */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(8, 8, 8, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-subtle);
            padding: 12px 0;
            transition: padding var(--transition), background var(--transition);
        }

        .header .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
        }
        .logo img {
            height: 40px;
            width: auto;
            object-fit: contain;
            background: transparent;
        }

        .desktop-nav {
            display: none;
            align-items: center;
            gap: 28px;
        }
        .desktop-nav a {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-muted);
            transition: color var(--transition);
        }
        .desktop-nav a:hover,
        .desktop-nav a.active {
            color: var(--white);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-actions .btn-accent {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--accent);
            color: #fff;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 6px 16px;
            border-radius: 50px;
            transition: background var(--transition), transform var(--transition);
            border: none;
        }
        .header-actions .btn-accent:hover {
            background: var(--accent-soft);
            transform: scale(1.02);
        }

        /* ===== AUTH SECTION (no container) ===== */
        .auth-section {
            max-width: 560px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .auth-heading {
            text-align: center;
            margin-bottom: 32px;
        }
        .auth-heading h2 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }
        .auth-heading p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--bg-secondary);
            border: 1.5px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            transition: border var(--transition), background var(--transition);
        }
        .input-group:focus-within {
            border-color: var(--accent);
            background: rgba(28, 28, 28, 0.9);
        }
        .input-group > i {
            color: var(--text-muted);
            font-size: 1.15rem;
            margin-right: 12px;
            flex-shrink: 0;
        }
        .input-group input {
            flex: 1;
            background: transparent;
            color: var(--white);
            font-size: 1rem;
            min-width: 0;
        }
        .input-group input::placeholder {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Phone input with flag */
        .phone-input-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .phone-flag {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 28px;
            border-radius: 6px;
            overflow: hidden;
            flex-shrink: 0;
            border: 1px solid var(--border-subtle);
            background: var(--bg-surface);
        }
        .phone-flag svg {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .phone-input-group input {
            border: none;
            background: transparent;
            color: var(--white);
            font-size: 1rem;
            width: 100%;
            min-width: 0;
        }

        /* Password toggle */
        .password-toggle {
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px;
            transition: color var(--transition);
        }
        .password-toggle:hover {
            color: var(--white);
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            font-size: 1.05rem;
            margin-top: 10px;
        }

        .form-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .form-footer a {
            color: var(--accent);
            font-weight: 600;
            margin-left: 4px;
        }

        .success-message {
            display: none;
            text-align: center;
            padding: 24px;
            background: rgba(199, 21, 21, 0.12);
            border-radius: var(--radius);
            border: 1px solid rgba(199, 21, 21, 0.3);
            margin-top: 24px;
        }
        .success-message i {
            font-size: 2.5rem;
            color: var(--accent);
            margin-bottom: 8px;
            display: block;
        }
        .success-message strong {
            font-size: 1.1rem;
            display: block;
            margin-bottom: 4px;
        }

        /* Responsive */
        @media (min-width: 900px) {
            .desktop-nav {
                display: flex;
            }
            .header .container {
                padding: 0 32px;
            }
            .auth-section {
                margin-top: 60px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="container">
            <div class="logo" id="logoHome">
                <img src="images/logo-akimark.png" onerror="this.onerror=null; this.src='images/logo-akimark.jpg';" alt="Akmark Logo">
            </div>

            <nav class="desktop-nav">
                <a href="index.html">Home</a>
                <a href="index.html#movies">Movies</a>
                <a href="index.html#series">Series</a>
                <a href="index.html#categories">Categories</a>
            </nav>

            <div class="header-actions">
                <a href="login.html" class="btn-accent">Login</a>
                <a href="register.html" class="btn-accent" style="background: var(--bg-secondary); color: var(--white); border: 1px solid var(--border-subtle);">Register</a>
            </div>
        </div>
    </header>

    <!-- ===== REGISTER FORM (no container) ===== -->
    <div class="auth-section">
        <div class="auth-heading">
            <h2>Create Account</h2>
            <p>Join Akmark and start watching</p>
        </div>

        <form id="registerForm" autocomplete="off">
            <!-- Full Name -->
            <div class="form-group">
                <label class="form-label" for="fullName">Full Name</label>
                <div class="input-group">
                    <i class="bi bi-person"></i>
                    <input type="text" id="fullName" placeholder="Enter your full name" required>
                </div>
            </div>

            <!-- Phone Number with Flag -->
            <div class="form-group">
                <label class="form-label" for="phoneNumber">Phone Number</label>
                <div class="input-group phone-input-group">
                    <span class="phone-flag" id="phoneFlag"></span>
                    <input type="tel" id="phoneNumber" placeholder="Phone Number" required>
                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <div class="input-group">
                    <i class="bi bi-lock"></i>
                    <input type="password" id="password" placeholder="Create a strong password" required minlength="6">
                    <span class="password-toggle" id="togglePassword"><i class="bi bi-eye"></i></span>
                </div>
            </div>

            <!-- Country Selector -->
            <div class="form-group">
                <label class="form-label" for="country">Country</label>
                <div class="input-group" style="padding: 14px 16px;">
                    <i class="bi bi-geo-alt"></i>
                    <select id="country" required style="flex:1; background:transparent; color:var(--white); cursor:pointer; appearance:none; -webkit-appearance:none;">
                        <option value="" disabled selected>Select your country</option>
                    </select>
                    <i class="bi bi-chevron-down" style="color:var(--text-muted); font-size:0.8rem; pointer-events:none;"></i>
                </div>
            </div>

            <button type="submit" class="btn-accent submit-btn">
                <i class="bi bi-person-plus"></i> Register
            </button>
        </form>

        <div class="success-message" id="successMessage">
            <i class="bi bi-check-circle-fill"></i>
            <strong>Registration Successful!</strong>
            <p>Welcome to Akmark</p>
        </div>

        <div class="form-footer">
            Already have an account? <a href="login.html">Login</a>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // Country data with flags (inline SVG) - Malawi, Zambia, Mozambique, Zimbabwe, South Africa, Tanzania
            const countries = [
                { code: 'MW', name: 'Malawi', flag: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect width="24" height="8" fill="#c71515"/><rect y="8" width="24" height="8" fill="#000"/><rect y="16" width="24" height="8" fill="#1e4d2b"/><circle cx="12" cy="6" r="3" fill="#fff"/><circle cx="12" cy="6" r="1.5" fill="#c71515"/></svg>' },
                { code: 'ZM', name: 'Zambia', flag: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect width="24" height="16" fill="#1e4d2b"/><rect y="16" width="24" height="8" fill="#c71515"/><rect x="0" y="0" width="12" height="8" fill="#000"/><rect x="12" y="0" width="12" height="8" fill="#f90"/><circle cx="12" cy="4" r="2" fill="#f90"/></svg>' },
                { code: 'MZ', name: 'Mozambique', flag: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect width="24" height="8" fill="#1e4d2b"/><rect y="8" width="24" height="8" fill="#000"/><rect y="16" width="24" height="8" fill="#c71515"/><rect width="10" height="24" fill="#f90"/><circle cx="5" cy="12" r="2" fill="#fff"/><circle cx="5" cy="12" r="1" fill="#000"/></svg>' },
                { code: 'ZW', name: 'Zimbabwe', flag: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect width="24" height="8" fill="#1e4d2b"/><rect y="8" width="24" height="8" fill="#c71515"/><rect y="16" width="24" height="8" fill="#000"/><rect width="8" height="24" fill="#fff"/><circle cx="4" cy="12" r="3" fill="#000"/><circle cx="4" cy="12" r="1.5" fill="#f90"/></svg>' },
                { code: 'ZA', name: 'South Africa', flag: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect width="24" height="24" fill="#1e4d2b"/><path d="M0 0h6v24H0z" fill="#c71515"/><path d="M6 0h6v24H6z" fill="#fff"/><path d="M12 0h6v24h-6z" fill="#000"/><path d="M18 0h6v24h-6z" fill="#f90"/></svg>' },
                { code: 'TZ', name: 'Tanzania', flag: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect width="24" height="24" fill="#1e4d2b"/><path d="M0 0l24 24" stroke="#000" stroke-width="6"/><path d="M0 0l24 24" stroke="#f90" stroke-width="3"/><path d="M24 0L0 24" stroke="#1e4d2b" stroke-width="4"/><path d="M24 0L0 24" stroke="#c71515" stroke-width="2"/></svg>' }
            ];

            const countrySelect = document.getElementById('country');
            const phoneFlag = document.getElementById('phoneFlag');

            // Populate country select
            countries.forEach(c => {
                const option = document.createElement('option');
                option.value = c.code;
                option.textContent = c.name;
                option.dataset.flag = c.flag;
                countrySelect.appendChild(option);
            });

            // Function to update phone flag based on selected country
            function updatePhoneFlag() {
                const selectedCode = countrySelect.value;
                const selectedCountry = countries.find(c => c.code === selectedCode);
                if (selectedCountry) {
                    phoneFlag.innerHTML = selectedCountry.flag;
                } else {
                    phoneFlag.innerHTML = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect width="24" height="24" fill="#333"/><circle cx="12" cy="12" r="5" fill="#c71515"/></svg>';
                }
            }

            // Auto-detect country
            function detectCountry() {
                const lang = navigator.language || navigator.userLanguage || '';
                const map = {
                    'en-MW': 'MW', 'en-ZM': 'ZM', 'en-MZ': 'MZ', 'en-ZW': 'ZW', 'en-ZA': 'ZA', 'en-TZ': 'TZ'
                };
                if (map[lang]) {
                    countrySelect.value = map[lang];
                } else {
                    countrySelect.value = 'MW';
                }
                updatePhoneFlag();
            }

            // Country change event
            countrySelect.addEventListener('change', updatePhoneFlag);

            // Password toggle
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');

            togglePassword.addEventListener('click', function() {
                const icon = this.querySelector('i');
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    icon.className = 'bi bi-eye-slash';
                } else {
                    passwordInput.type = 'password';
                    icon.className = 'bi bi-eye';
                }
            });

            // Form submit
            const form = document.getElementById('registerForm');
            const successMsg = document.getElementById('successMessage');

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                const fullName = document.getElementById('fullName').value.trim();
                const phone = document.getElementById('phoneNumber').value.trim();
                const password = document.getElementById('password').value.trim();
                const country = countrySelect.value;

                if (!fullName || !phone || !password || !country) {
                    alert('Please fill in all fields');
                    return;
                }

                console.log('Registering:', { fullName, phone, password, country });
                successMsg.style.display = 'block';
                form.style.display = 'none';
            });

            // Logo click
            document.getElementById('logoHome').addEventListener('click', function() {
                window.location.href = 'index.html';
            });

            // Initialize
            detectCountry();
        })();
    </script>
</body>
</html>
