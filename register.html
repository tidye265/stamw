<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Register — Akmark</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        /* ===== RESET & BASE ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #080808;
            --bg-surface: #151515;
            --bg-secondary: #1C1C1C;
            --accent: #c71515;
            --accent-soft: #a00f0f;
            --white: #FFFFFF;
            --text-muted: #A7A7A7;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --radius: 12px;
            --radius-sm: 8px;
            --radius-lg: 20px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            --transition: 0.25s cubic-bezier(0.2, 0, 0, 1);
        }

        html {
            font-size: 16px;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
            background: linear-gradient(180deg, #0a0a0a 0%, #080808 100%);
            color: var(--white);
            line-height: 1.6;
            min-height: 100vh;
        }

        a {
            color: inherit;
            text-decoration: none;
        }
        button {
            cursor: pointer;
            font-family: inherit;
            border: none;
            background: none;
            color: inherit;
        }
        input, select {
            font-family: inherit;
            border: none;
            outline: none;
            background: none;
            color: inherit;
        }
        img {
            display: block;
            max-width: 100%;
        }
        ul {
            list-style: none;
        }

        /* ===== HEADER ===== */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(8, 8, 8, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-subtle);
            padding: 12px 0;
            transition: padding var(--transition), background var(--transition);
        }

        .header .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
        }
        .logo img {
            height: 40px;
            width: auto;
            object-fit: contain;
            background: transparent;
        }

        .desktop-nav {
            display: none;
            align-items: center;
            gap: 28px;
        }
        .desktop-nav a {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-muted);
            transition: color var(--transition);
        }
        .desktop-nav a:hover,
        .desktop-nav a.active {
            color: var(--white);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-actions .btn-accent {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--accent);
            color: #fff;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 6px 16px;
            border-radius: 50px;
            transition: background var(--transition), transform var(--transition);
            border: none;
        }
        .header-actions .btn-accent:hover {
            background: var(--accent-soft);
            transform: scale(1.02);
        }

        /* ===== AUTH SECTION (no container) ===== */
        .auth-section {
            max-width: 560px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .auth-heading {
            text-align: center;
            margin-bottom: 32px;
        }
        .auth-heading h2 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }
        .auth-heading p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--bg-secondary);
            border: 1.5px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            transition: border var(--transition), background var(--transition);
        }
        .input-group:focus-within {
            border-color: var(--accent);
            background: rgba(28, 28, 28, 0.9);
        }
        .input-group > i {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-right: 10px;
            flex-shrink: 0;
        }
        .input-group input {
            flex: 1;
            background: transparent;
            color: var(--white);
            font-size: 0.95rem;
            min-width: 0;
        }
        .input-group input::placeholder {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* Phone input with flag */
        .phone-input-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .phone-flag {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 24px;
            border-radius: 4px;
            overflow: hidden;
            flex-shrink: 0;
            border: 1px solid var(--border-subtle);
            background: var(--bg-surface);
        }
        .phone-flag img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Password toggle */
        .password-toggle {
            color: var(--text-muted);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 4px;
            transition: color var(--transition);
        }
        .password-toggle:hover {
            color: var(--white);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            margin-top: 8px;
            background: var(--accent);
            color: #fff;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            border-radius: 50px;
            transition: background var(--transition), transform var(--transition);
            border: none;
        }
        .submit-btn:hover {
            background: var(--accent-soft);
            transform: scale(1.02);
        }

        .form-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .form-footer a {
            color: var(--accent);
            font-weight: 600;
            margin-left: 4px;
        }

        .success-message {
            display: none;
            text-align: center;
            padding: 24px;
            background: rgba(199, 21, 21, 0.12);
            border-radius: var(--radius);
            border: 1px solid rgba(199, 21, 21, 0.3);
            margin-top: 24px;
        }
        .success-message i {
            font-size: 2.5rem;
            color: var(--accent);
            margin-bottom: 8px;
            display: block;
        }
        .success-message strong {
            font-size: 1.1rem;
            display: block;
            margin-bottom: 4px;
        }

        /* Responsive */
        @media (min-width: 900px) {
            .desktop-nav {
                display: flex;
            }
            .header .container {
                padding: 0 32px;
            }
            .auth-section {
                margin-top: 60px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="container">
            <div class="logo" id="logoHome">
                <img src="images/logo-akimark.png" onerror="this.onerror=null; this.src='images/logo-akimark.jpg';" alt="Akmark Logo">
            </div>

            <nav class="desktop-nav">
                <a href="index.html">Home</a>
                <a href="index.html#movies">Movies</a>
                <a href="index.html#series">Series</a>
                <a href="index.html#categories">Categories</a>
            </nav>

            <div class="header-actions">
                <a href="login.html" class="btn-accent">Login</a>
                <a href="register.html" class="btn-accent" style="background: var(--bg-secondary); color: var(--white); border: 1px solid var(--border-subtle);">Register</a>
            </div>
        </div>
    </header>

    <!-- ===== REGISTER FORM (no container) ===== -->
    <div class="auth-section">
        <div class="auth-heading">
            <h2>Create Account</h2>
            <p>Join Akmark and start watching</p>
        </div>

        <form id="registerForm" autocomplete="off">
            <!-- Full Name -->
            <div class="form-group">
                <label class="form-label" for="fullName">Full Name</label>
                <div class="input-group">
                    <i class="bi bi-person"></i>
                    <input type="text" id="fullName" placeholder="Enter your full name" required>
                </div>
            </div>

            <!-- Phone Number with Flag (auto-detected) -->
            <div class="form-group">
                <label class="form-label" for="phoneNumber">Phone Number</label>
                <div class="input-group phone-input-group">
                    <span class="phone-flag" id="phoneFlag">
                        <!-- flag will be loaded via JS -->
                    </span>
                    <input type="tel" id="phoneNumber" placeholder="Phone Number" required>
                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <div class="input-group">
                    <i class="bi bi-lock"></i>
                    <input type="password" id="password" placeholder="Create a strong password" required minlength="6">
                    <span class="password-toggle" id="togglePassword"><i class="bi bi-eye"></i></span>
                </div>
            </div>

            <!-- Register Button (Red, no icon) -->
            <button type="submit" class="submit-btn">Register</button>
        </form>

        <div class="success-message" id="successMessage">
            <i class="bi bi-check-circle-fill"></i>
            <strong>Registration Successful!</strong>
            <p>Welcome to Akmark</p>
        </div>

        <div class="form-footer">
            Already have an account? <a href="login.html">Login</a>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // Country data with real flags from flagcdn.com
            const countries = {
                MW: { name: 'Malawi', flagUrl: 'https://flagcdn.com/w40/mw.png' },
                ZM: { name: 'Zambia', flagUrl: 'https://flagcdn.com/w40/zm.png' },
                MZ: { name: 'Mozambique', flagUrl: 'https://flagcdn.com/w40/mz.png' },
                ZW: { name: 'Zimbabwe', flagUrl: 'https://flagcdn.com/w40/zw.png' },
                ZA: { name: 'South Africa', flagUrl: 'https://flagcdn.com/w40/za.png' },
                TZ: { name: 'Tanzania', flagUrl: 'https://flagcdn.com/w40/tz.png' }
            };

            const phoneFlag = document.getElementById('phoneFlag');

            // Auto-detect country based on browser language (or default to Malawi)
            function detectCountryCode() {
                const lang = navigator.language || navigator.userLanguage || '';
                const map = {
                    'en-MW': 'MW', 'en-ZM': 'ZM', 'en-MZ': 'MZ', 'en-ZW': 'ZW', 'en-ZA': 'ZA', 'en-TZ': 'TZ'
                };
                if (map[lang]) {
                    return map[lang];
                }
                // default to Malawi if not detected
                return 'MW';
            }

            // Update flag display
            function updatePhoneFlag() {
                const code = detectCountryCode();
                const country = countries[code];
                if (country) {
                    phoneFlag.innerHTML = `<img src="${country.flagUrl}" alt="${country.name} flag">`;
                } else {
                    phoneFlag.innerHTML = '<img src="https://flagcdn.com/w40/mw.png" alt="Malawi flag">';
                }
            }

            // Password toggle
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');

            togglePassword.addEventListener('click', function() {
                const icon = this.querySelector('i');
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    icon.className = 'bi bi-eye-slash';
                } else {
                    passwordInput.type = 'password';
                    icon.className = 'bi bi-eye';
                }
            });

            // Form submit
            const form = document.getElementById('registerForm');
            const successMsg = document.getElementById('successMessage');

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                const fullName = document.getElementById('fullName').value.trim();
                const phone = document.getElementById('phoneNumber').value.trim();
                const password = document.getElementById('password').value.trim();

                if (!fullName || !phone || !password) {
                    alert('Please fill in all fields');
                    return;
                }

                console.log('Registering:', { fullName, phone, password });
                successMsg.style.display = 'block';
                form.style.display = 'none';
            });

            // Logo click
            document.getElementById('logoHome').addEventListener('click', function() {
                window.location.href = 'index.html';
            });

            // Initialize flag
            updatePhoneFlag();
        })();
    </script>
</body>
</html>
