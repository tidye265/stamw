<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#080101">
    <title>Register — Akmark</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #080101;
            --surface: #151515;
            --accent: #ff0c0c;
            --accent-soft: #d90000;
            --white: #fff;
            --muted: #a7a7a7;
            --border: rgba(255, 255, 255, 0.08);
            --radius: 14px;
            --transition: 0.25s cubic-bezier(0.2, 0, 0, 1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
            background: var(--bg);
            color: var(--white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 460px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        .logo {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }

        .logo img {
            height: 56px;
            width: auto;
            object-fit: contain;
        }

        h2 {
            text-align: center;
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            font-size: 0.9rem;
            margin-bottom: 32px;
        }

        .field {
            margin-bottom: 20px;
        }

        .field label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        .field label i {
            color: var(--accent);
        }

        .input-group {
            display: flex;
            align-items: center;
            background: #1e1e1e;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 0 14px;
            transition: border-color var(--transition), box-shadow var(--transition);
        }

        .input-group:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(255, 12, 12, 0.15);
        }

        .input-group input {
            flex: 1;
            padding: 16px 0;
            background: transparent;
            border: none;
            outline: none;
            color: var(--white);
            font-size: 1rem;
        }

        .input-group input::placeholder {
            color: #777;
        }

        .flag-selector {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #1e1e1e;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 10px 14px;
            cursor: pointer;
            transition: border-color var(--transition);
            position: relative;
        }

        .flag-selector:hover,
        .flag-selector.open {
            border-color: var(--accent);
        }

        .flag-img {
            width: 36px;
            height: 26px;
            object-fit: cover;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .flag-selector .country-name {
            flex: 1;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--white);
        }

        .flag-selector i {
            color: var(--muted);
            font-size: 0.9rem;
        }

        .country-dropdown {
            position: absolute;
            top: 110%;
            left: 0;
            right: 0;
            background: #1c1c1c;
            border: 1px solid var(--border);
            border-radius: 12px;
            max-height: 240px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        }

        .country-dropdown.open {
            display: block;
        }

        .country-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            cursor: pointer;
            transition: background var(--transition);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .country-item:last-child {
            border-bottom: none;
        }

        .country-item:hover {
            background: rgba(255, 12, 12, 0.1);
        }

        .country-item img {
            width: 32px;
            height: 22px;
            object-fit: cover;
            border-radius: 3px;
        }

        .country-item span {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--white);
        }

        .btn-submit {
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--accent);
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            padding: 16px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background var(--transition), transform var(--transition);
            margin-top: 12px;
        }

        .btn-submit:hover {
            background: var(--accent-soft);
            transform: scale(1.01);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .auth-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.88rem;
            color: var(--muted);
        }

        .auth-footer a {
            color: var(--accent);
            font-weight: 600;
            text-decoration: none;
            margin-left: 6px;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: rgba(255, 12, 12, 0.1);
            border: 1px solid rgba(255, 12, 12, 0.3);
            color: #ff6b6b;
            font-size: 0.85rem;
            padding: 10px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        @media (max-width: 480px) {
            .auth-container {
                padding: 32px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="logo">
            <img src="images/akimark-logo.jpg" alt="Akmark">
        </div>
        <h2>Create Account</h2>
        <p class="subtitle">Join Akmark and start watching instantly</p>

        <div class="error-message" id="errorMsg"></div>

        <form id="registerForm">
            <!-- Full Name -->
            <div class="field">
                <label for="fullName"><i class="bi bi-person-circle"></i> Full Name</label>
                <div class="input-group">
                    <input type="text" id="fullName" placeholder="Enter your full name" required>
                </div>
            </div>

            <!-- Country with flag -->
            <div class="field">
                <label><i class="bi bi-globe-americas"></i> Country</label>
                <div class="flag-selector" id="countrySelector">
                    <img class="flag-img" id="selectedFlag" src="https://flagcdn.com/w80/us.png" alt="flag">
                    <span class="country-name" id="selectedCountry">United States</span>
                    <i class="bi bi-chevron-down"></i>
                </div>
                <div class="country-dropdown" id="countryDropdown">
                    <!-- populated by JS -->
                </div>
                <input type="hidden" id="countryCode" value="US">
            </div>

            <!-- Phone Number -->
            <div class="field">
                <label for="phone"><i class="bi bi-telephone"></i> Phone Number</label>
                <div class="input-group">
                    <input type="tel" id="phone" placeholder="+1 234 567 890" required>
                </div>
            </div>

            <!-- Password -->
            <div class="field">
                <label for="password"><i class="bi bi-lock"></i> Password</label>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Create a strong password" required minlength="6">
                </div>
            </div>

            <button type="submit" class="btn-submit">
                <i class="bi bi-person-plus"></i> Register
            </button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="login.html">Login</a>
        </div>
    </div>

    <script>
        // Country database with flag URLs (real flags from flagcdn)
        const countries = [
            { code: "US", name: "United States", flag: "https://flagcdn.com/w80/us.png" },
            { code: "GB", name: "United Kingdom", flag: "https://flagcdn.com/w80/gb.png" },
            { code: "CN", name: "China", flag: "https://flagcdn.com/w80/cn.png" },
            { code: "IN", name: "India", flag: "https://flagcdn.com/w80/in.png" },
            { code: "JP", name: "Japan", flag: "https://flagcdn.com/w80/jp.png" },
            { code: "KR", name: "South Korea", flag: "https://flagcdn.com/w80/kr.png" },
            { code: "MW", name: "Malawi", flag: "https://flagcdn.com/w80/mw.png" },
            { code: "ZA", name: "South Africa", flag: "https://flagcdn.com/w80/za.png" },
            { code: "NG", name: "Nigeria", flag: "https://flagcdn.com/w80/ng.png" },
            { code: "KE", name: "Kenya", flag: "https://flagcdn.com/w80/ke.png" },
            { code: "TZ", name: "Tanzania", flag: "https://flagcdn.com/w80/tz.png" },
            { code: "EG", name: "Egypt", flag: "https://flagcdn.com/w80/eg.png" },
            { code: "GH", name: "Ghana", flag: "https://flagcdn.com/w80/gh.png" },
            { code: "CA", name: "Canada", flag: "https://flagcdn.com/w80/ca.png" },
            { code: "AU", name: "Australia", flag: "https://flagcdn.com/w80/au.png" },
            { code: "DE", name: "Germany", flag: "https://flagcdn.com/w80/de.png" },
            { code: "FR", name: "France", flag: "https://flagcdn.com/w80/fr.png" },
            { code: "BR", name: "Brazil", flag: "https://flagcdn.com/w80/br.png" },
            { code: "MX", name: "Mexico", flag: "https://flagcdn.com/w80/mx.png" },
            { code: "IT", name: "Italy", flag: "https://flagcdn.com/w80/it.png" },
            { code: "ES", name: "Spain", flag: "https://flagcdn.com/w80/es.png" },
            { code: "RU", name: "Russia", flag: "https://flagcdn.com/w80/ru.png" },
            { code: "SA", name: "Saudi Arabia", flag: "https://flagcdn.com/w80/sa.png" },
            { code: "AE", name: "UAE", flag: "https://flagcdn.com/w80/ae.png" },
            { code: "ZM", name: "Zambia", flag: "https://flagcdn.com/w80/zm.png" },
            { code: "ZW", name: "Zimbabwe", flag: "https://flagcdn.com/w80/zw.png" },
            { code: "UG", name: "Uganda", flag: "https://flagcdn.com/w80/ug.png" },
            { code: "ET", name: "Ethiopia", flag: "https://flagcdn.com/w80/et.png" },
            { code: "PK", name: "Pakistan", flag: "https://flagcdn.com/w80/pk.png" },
            { code: "BD", name: "Bangladesh", flag: "https://flagcdn.com/w80/bd.png" }
        ];

        const countrySelector = document.getElementById('countrySelector');
        const countryDropdown = document.getElementById('countryDropdown');
        const selectedFlag = document.getElementById('selectedFlag');
        const selectedCountry = document.getElementById('selectedCountry');
        const countryCodeInput = document.getElementById('countryCode');

        // Auto-detect country via timezone or language
        function detectCountry() {
            try {
                const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
                const language = navigator.language || 'en-US';
                const region = timezone.split('/').pop() || language.split('-')[1] || 'US';

                const map = {
                    'US': 'US', 'United States': 'US', 'America': 'US',
                    'GB': 'GB', 'UK': 'GB', 'Europe/London': 'GB', 'England': 'GB',
                    'CN': 'CN', 'China': 'CN', 'Shanghai': 'CN',
                    'IN': 'IN', 'India': 'IN', 'Calcutta': 'IN', 'Kolkata': 'IN',
                    'JP': 'JP', 'Japan': 'JP', 'Tokyo': 'JP',
                    'KR': 'KR', 'South Korea': 'KR', 'Seoul': 'KR',
                    'MW': 'MW', 'Malawi': 'MW', 'Blantyre': 'MW',
                    'ZA': 'ZA', 'South Africa': 'ZA', 'Johannesburg': 'ZA',
                    'NG': 'NG', 'Nigeria': 'NG', 'Lagos': 'NG',
                    'KE': 'KE', 'Kenya': 'KE', 'Nairobi': 'KE',
                    'TZ': 'TZ', 'Tanzania': 'TZ', 'Dar_es_Salaam': 'TZ',
                    'EG': 'EG', 'Egypt': 'EG', 'Cairo': 'EG',
                    'GH': 'GH', 'Ghana': 'GH', 'Accra': 'GH',
                    'CA': 'CA', 'Canada': 'CA', 'Toronto': 'CA',
                    'AU': 'AU', 'Australia': 'AU', 'Sydney': 'AU',
                    'DE': 'DE', 'Germany': 'DE', 'Berlin': 'DE',
                    'FR': 'FR', 'France': 'FR', 'Paris': 'FR',
                    'BR': 'BR', 'Brazil': 'BR', 'Sao_Paulo': 'BR',
                    'MX': 'MX', 'Mexico': 'MX', 'Mexico_City': 'MX',
                    'IT': 'IT', 'Italy': 'IT', 'Rome': 'IT',
                    'ES': 'ES', 'Spain': 'ES', 'Madrid': 'ES',
                    'RU': 'RU', 'Russia': 'RU', 'Moscow': 'RU',
                    'SA': 'SA', 'Saudi Arabia': 'SA', 'Riyadh': 'SA',
                    'AE': 'AE', 'UAE': 'AE', 'Dubai': 'AE',
                    'ZM': 'ZM', 'Zambia': 'ZM', 'Lusaka': 'ZM',
                    'ZW': 'ZW', 'Zimbabwe': 'ZW', 'Harare': 'ZW',
                    'UG': 'UG', 'Uganda': 'UG', 'Kampala': 'UG',
                    'ET': 'ET', 'Ethiopia': 'ET', 'Addis_Ababa': 'ET',
                    'PK': 'PK', 'Pakistan': 'PK', 'Karachi': 'PK',
                    'BD': 'BD', 'Bangladesh': 'BD', 'Dhaka': 'BD'
                };

                let code = map[region];
                if (code) {
                    return code.toUpperCase();
                }
                // fallback: parse language
                const langRegion = (language.split('-')[1] || 'US').toUpperCase();
                return countries.find(c => c.code === langRegion) ? langRegion : 'US';
            } catch (e) {
                return 'US';
            }
        }

        // Build dropdown
        function buildDropdown() {
            countryDropdown.innerHTML = '';
            countries.forEach(c => {
                const item = document.createElement('div');
                item.className = 'country-item';
                item.dataset.code = c.code;
                item.dataset.name = c.name;
                item.dataset.flag = c.flag;
                item.innerHTML = `<img src="${c.flag}" alt="${c.name}"><span>${c.name}</span>`;
                item.addEventListener('click', function() {
                    selectCountry(c.code, c.name, c.flag);
                    countryDropdown.classList.remove('open');
                });
                countryDropdown.appendChild(item);
            });
        }

        function selectCountry(code, name, flag) {
            selectedFlag.src = flag;
            selectedCountry.textContent = name;
            countryCodeInput.value = code;
        }

        // Set default country by detection
        const detectedCode = detectCountry();
        const detected = countries.find(c => c.code === detectedCode);
        if (detected) {
            selectCountry(detected.code, detected.name, detected.flag);
        } else {
            selectCountry('US', 'United States', 'https://flagcdn.com/w80/us.png');
        }

        // Toggle dropdown
        countrySelector.addEventListener('click', function(e) {
            e.stopPropagation();
            countryDropdown.classList.toggle('open');
        });

        // Close on outside click
        document.addEventListener('click', function(e) {
            if (!countrySelector.contains(e.target) && !countryDropdown.contains(e.target)) {
                countryDropdown.classList.remove('open');
            }
        });

        buildDropdown();

        // Form submission
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value.trim();
            const countryCode = countryCodeInput.value;

            const errorMsg = document.getElementById('errorMsg');
            errorMsg.classList.remove('show');

            if (!fullName || fullName.length < 3) {
                errorMsg.textContent = 'Please enter your full name (at least 3 characters).';
                errorMsg.classList.add('show');
                return;
            }

            if (!phone || phone.replace(/\D/g, '').length < 7) {
                errorMsg.textContent = 'Please enter a valid phone number.';
                errorMsg.classList.add('show');
                return;
            }

            if (!password || password.length < 6) {
                errorMsg.textContent = 'Password must be at least 6 characters long.';
                errorMsg.classList.add('show');
                return;
            }

            // Store registration data
            const user = {
                fullName,
                phone,
                countryCode,
                password,
                registeredAt: new Date().toISOString()
            };

            localStorage.setItem('akmark_registered_user', JSON.stringify(user));

            // Simulate success and redirect to login
            alert('Registration successful! Please login.');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
