<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Register — Akmark</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        /* ===== RESET & BASE ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #080808;
            --bg-surface: #151515;
            --bg-secondary: #1C1C1C;
            --accent: #c71515;
            --accent-soft: #a00f0f;
            --white: #FFFFFF;
            --text-muted: #A7A7A7;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --radius: 12px;
            --radius-sm: 8px;
            --radius-lg: 20px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            --transition: 0.25s cubic-bezier(0.2, 0, 0, 1);
        }

        html {
            font-size: 16px;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
            background: var(--bg-primary);
            color: var(--white);
            line-height: 1.6;
            min-height: 100vh;
        }

        a {
            color: inherit;
            text-decoration: none;
        }
        button {
            cursor: pointer;
            font-family: inherit;
            border: none;
            background: none;
            color: inherit;
        }
        input, select {
            font-family: inherit;
            border: none;
            outline: none;
            background: none;
            color: inherit;
        }
        img {
            display: block;
            max-width: 100%;
        }
        ul {
            list-style: none;
        }

        /* ===== HEADER (same as index) ===== */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(8, 8, 8, 0.96);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-subtle);
            padding: 12px 0;
            transition: padding var(--transition), background var(--transition);
        }

        .header .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
        }
        .logo img {
            height: 40px;
            width: auto;
            object-fit: contain;
            background: transparent;
        }

        .desktop-nav {
            display: none;
            align-items: center;
            gap: 28px;
        }
        .desktop-nav a {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-muted);
            transition: color var(--transition);
        }
        .desktop-nav a:hover,
        .desktop-nav a.active {
            color: var(--white);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-actions .btn-accent {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--accent);
            color: #fff;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 6px 16px;
            border-radius: 50px;
            transition: background var(--transition), transform var(--transition);
            border: none;
        }
        .header-actions .btn-accent:hover {
            background: var(--accent-soft);
            transform: scale(1.02);
        }

        /* ===== MAIN FORM ===== */
        .auth-container {
            max-width: 480px;
            margin: 40px auto;
            padding: 0 16px;
        }

        .auth-card {
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            padding: 32px 24px;
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow);
        }

        .auth-title {
            font-size: 1.8rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .auth-subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--bg-secondary);
            border: 1.5px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            transition: border var(--transition), background var(--transition);
        }
        .input-group:focus-within {
            border-color: var(--accent);
            background: rgba(21, 21, 21, 0.9);
        }
        .input-group i {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-right: 10px;
            flex-shrink: 0;
        }
        .input-group input {
            flex: 1;
            background: transparent;
            color: var(--white);
            font-size: 0.95rem;
        }
        .input-group input::placeholder {
            color: var(--text-muted);
        }

        /* Country select with flag */
        .country-select {
            position: relative;
        }
        .country-select select {
            appearance: none;
            width: 100%;
            padding: 12px 40px 12px 16px;
            background: var(--bg-secondary);
            border: 1.5px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            color: var(--white);
            font-size: 0.95rem;
            cursor: pointer;
            transition: border var(--transition);
        }
        .country-select select:focus {
            border-color: var(--accent);
        }
        .country-select::after {
            content: '\f282';
            font-family: 'bootstrap-icons';
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.9rem;
            pointer-events: none;
        }
        .country-flag {
            display: inline-block;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            margin-right: 8px;
            vertical-align: middle;
            overflow: hidden;
            flex-shrink: 0;
        }
        .country-flag svg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 3px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            font-size: 1.05rem;
            margin-top: 8px;
        }

        .form-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .form-footer a {
            color: var(--accent);
            font-weight: 600;
            margin-left: 4px;
        }

        .success-message {
            display: none;
            text-align: center;
            padding: 20px;
            background: rgba(199, 21, 21, 0.1);
            border-radius: var(--radius);
            border: 1px solid rgba(199, 21, 21, 0.3);
            margin-top: 16px;
        }
        .success-message i {
            font-size: 2rem;
            color: var(--accent);
            margin-bottom: 8px;
            display: block;
        }

        /* Responsive */
        @media (min-width: 900px) {
            .desktop-nav {
                display: flex;
            }
            .header .container {
                padding: 0 32px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="container">
            <div class="logo" id="logoHome">
                <img src="images/logo-akimark.png" onerror="this.onerror=null; this.src='images/logo-akimark.jpg';" alt="Akmark Logo">
            </div>

            <nav class="desktop-nav">
                <a href="index.html">Home</a>
                <a href="index.html#movies">Movies</a>
                <a href="index.html#series">Series</a>
                <a href="index.html#categories">Categories</a>
            </nav>

            <div class="header-actions">
                <a href="login.html" class="btn-accent">Login</a>
                <a href="register.html" class="btn-accent" style="background: var(--bg-secondary); color: var(--white); border: 1px solid var(--border-subtle);">Register</a>
            </div>
        </div>
    </header>

    <!-- ===== REGISTER FORM ===== -->
    <div class="auth-container">
        <div class="auth-card">
            <h2 class="auth-title">Create Account</h2>
            <p class="auth-subtitle">Join Akmark and start watching</p>

            <form id="registerForm" autocomplete="off">
                <!-- Full Name -->
                <div class="form-group">
                    <label class="form-label" for="fullName">Full Name</label>
                    <div class="input-group">
                        <i class="bi bi-person"></i>
                        <input type="text" id="fullName" placeholder="John Doe" required>
                    </div>
                </div>

                <!-- Phone Number -->
                <div class="form-group">
                    <label class="form-label" for="phoneNumber">Phone Number</label>
                    <div class="input-group">
                        <i class="bi bi-telephone"></i>
                        <input type="tel" id="phoneNumber" placeholder="+265 999 000 000" required>
                    </div>
                </div>

                <!-- Country Selector -->
                <div class="form-group">
                    <label class="form-label" for="country">Country</label>
                    <div class="input-group country-select">
                        <i class="bi bi-geo-alt"></i>
                        <select id="country" required>
                            <option value="" disabled selected>Select your country</option>
                            <!-- Options will be populated by JS -->
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn-accent submit-btn">
                    <i class="bi bi-person-plus"></i> Register
                </button>
            </form>

            <div class="success-message" id="successMessage">
                <i class="bi bi-check-circle-fill"></i>
                <strong>Registration Successful!</strong>
                <p>Welcome to Akmark</p>
            </div>

            <div class="form-footer">
                Already have an account? <a href="login.html">Login</a>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // Country data with flags (inline SVG)
            const countries = [
                { code: 'MW', name: 'Malawi', flag: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect width="24" height="8" fill="#c71515"/><rect y="8" width="24" height="8" fill="#000"/><rect y="16" width="24" height="8" fill="#1e4d2b"/><circle cx="12" cy="6" r="3" fill="#fff"/><circle cx="12" cy="6" r="1.5" fill="#c71515"/></svg>' },
                { code: 'ZM', name: 'Zambia', flag: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect width="24" height="16" fill="#1e4d2b"/><rect y="16" width="24" height="8" fill="#c71515"/><rect x="0" y="0" width="12" height="8" fill="#000"/><rect x="12" y="0" width="12" height="8" fill="#f90"/><circle cx="12" cy="4" r="2" fill="#f90"/></svg>' },
                { code: 'MZ', name: 'Mozambique', flag: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect width="24" height="8" fill="#1e4d2b"/><rect y="8" width="24" height="8" fill="#000"/><rect y="16" width="24" height="8" fill="#c71515"/><rect width="10" height="24" fill="#f90"/><circle cx="5" cy="12" r="2" fill="#fff"/><circle cx="5" cy="12" r="1" fill="#000"/></svg>' },
                { code: 'ZW', name: 'Zimbabwe', flag: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect width="24" height="8" fill="#1e4d2b"/><rect y="8" width="24" height="8" fill="#c71515"/><rect y="16" width="24" height="8" fill="#000"/><rect width="8" height="24" fill="#fff"/><circle cx="4" cy="12" r="3" fill="#000"/><circle cx="4" cy="12" r="1.5" fill="#f90"/></svg>' },
                { code: 'ZA', name: 'South Africa', flag: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect width="24" height="24" fill="#1e4d2b"/><path d="M0 0h6v24H0z" fill="#c71515"/><path d="M6 0h6v24H6z" fill="#fff"/><path d="M12 0h6v24h-6z" fill="#000"/><path d="M18 0h6v24h-6z" fill="#f90"/></svg>' },
                { code: 'TZ', name: 'Tanzania', flag: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect width="24" height="24" fill="#1e4d2b"/><path d="M0 0l24 24" stroke="#000" stroke-width="6"/><path d="M0 0l24 24" stroke="#f90" stroke-width="3"/><path d="M24 0L0 24" stroke="#1e4d2b" stroke-width="4"/><path d="M24 0L0 24" stroke="#c71515" stroke-width="2"/></svg>' }
            ];

            // Populate country select
            const countrySelect = document.getElementById('country');
            countries.forEach(c => {
                const option = document.createElement('option');
                option.value = c.code;
                option.innerHTML = `<span class="country-flag">${c.flag}</span> ${c.name}`;
                option.dataset.flag = c.flag;
                countrySelect.appendChild(option);
            });

            // Auto-detect country based on browser language
            function detectCountry() {
                const lang = navigator.language || navigator.userLanguage || '';
                const map = {
                    'en-MW': 'MW', 'en-ZM': 'ZM', 'en-MZ': 'MZ', 'en-ZW': 'ZW', 'en-ZA': 'ZA', 'en-TZ': 'TZ'
                };
                if (map[lang]) {
                    countrySelect.value = map[lang];
                } else {
                    // fallback to 'en' default
                    countrySelect.value = 'MW';
                }
            }
            detectCountry();

            // Handle form submit
            const form = document.getElementById('registerForm');
            const successMsg = document.getElementById('successMessage');

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                const fullName = document.getElementById('fullName').value.trim();
                const phone = document.getElementById('phoneNumber').value.trim();
                const country = countrySelect.value;

                if (!fullName || !phone || !country) {
                    alert('Please fill in all fields');
                    return;
                }

                // Simulate registration
                console.log('Registering:', { fullName, phone, country });
                successMsg.style.display = 'block';
                form.style.display = 'none';
            });

            // Logo click to home
            document.getElementById('logoHome').addEventListener('click', function() {
                window.location.href = 'index.html';
            });
        })();
    </script>
</body>
</html>
