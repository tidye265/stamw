<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Watch - Akimark</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg-primary: #080808;
            --bg-surface: #151515;
            --bg-secondary: #1C1C1C;
            --accent: #c71515;
            --accent-soft: #a00f0f;
            --white: #FFFFFF;
            --text-muted: #A7A7A7;
            --border-subtle: rgba(255,255,255,0.08);
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 8px 32px rgba(0,0,0,0.6);
            --transition: 0.25s ease;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-primary); color: var(--white); min-height: 100vh; overflow-x: hidden; padding-bottom: 40px; user-select: none; -webkit-user-select: none; }
        body::-webkit-scrollbar { display: none; }

        /* Header */
        .header { position: sticky; top:0; z-index:100; background: var(--bg-primary); border-bottom:1px solid var(--border-subtle); padding:12px 16px; display:flex; align-items:center; justify-content:space-between; }
        .header .back-btn { display:inline-flex; align-items:center; gap:6px; color:var(--text-muted); font-size:0.9rem; font-weight:600; text-decoration:none; padding:8px 12px; border-radius:50px; transition:all 0.2s; }
        .header .back-btn:hover { color:#fff; background:rgba(255,255,255,0.08); }
        .header .back-btn svg { width:18px; height:18px; fill:currentColor; }
        .header .logo img { height:32px; width:auto; object-fit:contain; }

        .container { max-width:500px; margin:20px auto; padding:0 16px; }

        /* Skeleton */
        .skeleton { display:block; }
        .skeleton-hidden { display:none; }
        .sk-block { background:var(--bg-secondary); border-radius:var(--radius); position:relative; overflow:hidden; }
        .sk-block::after { content:''; position:absolute; inset:0; background:linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent); animation:shimmer 1.2s infinite; }
        .sk-poster { width:100%; aspect-ratio:3/4; }
        .sk-title { height:20px; width:60%; margin-top:16px; border-radius:6px; }
        .sk-meta { height:12px; width:40%; margin-top:10px; border-radius:6px; }
        .sk-price { height:16px; width:30%; margin-top:12px; border-radius:6px; }
        .sk-btn { height:50px; margin-top:16px; border-radius:var(--radius-sm); }
        @keyframes shimmer { 0% { background-position:-200% 0; } 100% { background-position:200% 0; } }

        /* Movie Card */
        .movie-card { display:none; background:var(--bg-surface); border:1px solid var(--border-subtle); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); }
        .poster-wrap { width:100%; aspect-ratio:3/4; position:relative; background:var(--bg-secondary); }
        .poster-wrap img { width:100%; height:100%; object-fit:cover; }
        .badge { position:absolute; top:12px; right:12px; background:rgba(0,0,0,0.7); color:#fff; font-size:0.65rem; font-weight:700; padding:5px 10px; border-radius:20px; border:1px solid var(--border-subtle); text-transform:uppercase; letter-spacing:0.5px; }
        .play-icon { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:64px; height:64px; background:rgba(0,0,0,0.8); border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; border:2px solid #fff; transition:transform 0.2s, background 0.2s; }
        .play-icon:hover { transform:translate(-50%,-50%) scale(1.1); background:rgba(199,21,21,0.9); }
        .play-icon svg { width:28px; height:28px; fill:#fff; }
        .card-content { padding:16px; }
        .movie-title { font-size:1.3rem; font-weight:800; margin-bottom:8px; text-transform:uppercase; letter-spacing:-0.5px; line-height:1.2; }
        .movie-meta { display:flex; align-items:center; gap:10px; color:var(--text-muted); font-size:0.8rem; margin-bottom:12px; }
        .movie-price { font-size:1.1rem; font-weight:800; color:var(--accent); margin-bottom:16px; }
        .watch-btn { width:100%; display:flex; align-items:center; justify-content:center; gap:8px; background:linear-gradient(135deg, var(--accent), var(--accent-soft)); color:#fff; padding:14px; border-radius:var(--radius-sm); font-size:1rem; font-weight:800; border:none; cursor:pointer; transition:transform 0.2s, box-shadow 0.2s; text-transform:uppercase; letter-spacing:0.5px; }
        .watch-btn:hover { transform:translateY(-1px); box-shadow:0 6px 16px rgba(199,21,21,0.4); }
        .watch-btn:active { transform:scale(0.98); }
        .watch-btn svg { width:20px; height:20px; fill:currentColor; }

        /* Video Player */
        #player { width:100%; max-width:100%; background:#000; border-radius:var(--radius-sm); margin-top:20px; display:none; aspect-ratio:16/9; }
        #countdown { text-align:center; color:var(--text-muted); font-size:0.85rem; margin-top:12px; font-weight:600; }
        #countdown.warning { color:#ff9800; }

        /* Bottom Sheet Modal */
        .modal-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.7); z-index:2000; display:none; align-items:flex-end; justify-content:center; }
        .modal-overlay.active { display:flex; }
        .bottom-sheet { background:var(--bg-surface); width:100%; max-width:500px; border-top-left-radius:20px; border-top-right-radius:20px; padding:20px 16px 30px; transform:translateY(100%); transition:transform 0.3s ease; }
        .modal-overlay.active .bottom-sheet { transform:translateY(0); }
        .sheet-handle { width:40px; height:4px; background:var(--border-subtle); border-radius:4px; margin:0 auto 16px; }
        .sheet-title { font-size:1.1rem; font-weight:700; text-align:center; margin-bottom:16px; }
        .methods-title { font-size:0.7rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:8px; text-align:center; }
        .method-options { display:flex; justify-content:center; gap:20px; margin-bottom:16px; }
        .method-card { width:80px; height:80px; background:transparent; border:none; cursor:pointer; transition:transform 0.2s, opacity 0.2s; display:flex; align-items:center; justify-content:center; position:relative; }
        .method-card.selected { transform:scale(1.1); opacity:1; }
        .method-card:not(.selected) { opacity:0.6; }
        .method-card img { width:100%; height:100%; object-fit:contain; }
        .tick-icon { position:absolute; top:0; right:0; background:#4caf50; color:#fff; width:15px; height:15px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:bold; opacity:0; transform:scale(0.5); transition:all 0.2s; }
        .method-card.selected .tick-icon { opacity:1; transform:scale(1); }
        .phone-label { font-size:0.7rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px; }
        .phone-input-wrap { display:flex; align-items:center; background:var(--bg-secondary); border:1px solid var(--border-subtle); border-radius:var(--radius-sm); padding:4px 10px; margin-bottom:12px; }
        .phone-input-wrap input { flex:1; background:transparent; border:none; outline:none; color:#fff; font-size:1rem; font-weight:700; padding:8px; min-width:0; }
        .confirm-btn { width:100%; padding:12px; background:linear-gradient(135deg, var(--accent), var(--accent-soft)); color:#fff; font-size:0.95rem; font-weight:800; border:none; border-radius:var(--radius-sm); cursor:pointer; text-transform:uppercase; letter-spacing:0.3px; }
        .confirm-btn:disabled { background:#444; cursor:not-allowed; }
        .close-sheet { position:absolute; top:16px; right:16px; background:none; border:none; color:var(--text-muted); font-size:1.5rem; cursor:pointer; }
        .close-sheet:hover { color:#fff; }
    </style>
</head>
<body>
    <header class="header">
        <a href="non.html" class="back-btn"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg> Back</a>
        <div class="logo"><img src="images/logo-akimark.png" onerror="this.onerror=null; this.src='images/logo-akimark.jpg';" alt="Akimark"></div>
        <span style="width:60px;"></span>
    </header>

    <main class="container">
        <!-- Skeleton -->
        <div id="skeleton" class="skeleton">
            <div class="sk-block sk-poster"></div>
            <div class="sk-block sk-title"></div>
            <div class="sk-block sk-meta"></div>
            <div class="sk-block sk-price"></div>
            <div class="sk-block sk-btn"></div>
        </div>

        <!-- Movie Card -->
        <div id="movieCard" class="movie-card">
            <div class="poster-wrap">
                <img id="poster" src="" alt="Poster">
                <span id="qualityBadge" class="badge">HD</span>
                <div class="play-icon" id="playIcon" onclick="openPaymentSheet()">
                    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </div>
            </div>
            <div class="card-content">
                <h1 id="title" class="movie-title">Movie Title</h1>
                <div class="movie-meta"><span id="year">2024</span><span>•</span><span id="category">Action</span></div>
                <div id="price" class="movie-price">MK 0.00</div>
                <button id="watchBtn" class="watch-btn" onclick="openPaymentSheet()">
                    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    WATCH NOW
                </button>
            </div>
        </div>

        <!-- Video Player -->
        <video id="player" controls playsinline></video>
        <p id="countdown"></p>
    </main>

    <!-- Bottom Sheet Modal -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
        <div class="bottom-sheet">
            <div class="sheet-handle"></div>
            <button class="close-sheet" onclick="closeModal()">&times;</button>
            <div class="sheet-title">Choose Payment Method</div>

            <div class="methods-title">Select Network</div>
            <div class="method-options">
                <div class="method-card" data-method="tnm" onclick="selectMethod('tnm')">
                    <img src="images/tnm2.png" alt="TNM">
                    <div class="tick-icon">✓</div>
                </div>
                <div class="method-card" data-method="airtel" onclick="selectMethod('airtel')">
                    <img src="images/airtel1.png" alt="Airtel">
                    <div class="tick-icon">✓</div>
                </div>
            </div>

            <div class="phone-label">Phone Number</div>
            <div class="phone-input-wrap">
                <input type="tel" id="phoneNumber" placeholder="09XXXXXXXX" maxlength="10">
            </div>

            <button class="confirm-btn" id="confirmBtn" onclick="confirmPayment()">PAY NOW</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="javascript.js/supabase.js"></script>
    <script src="javascript.js/non-view.js"></script>
</body>
</html>
