<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Watch - Akimark</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --bg-primary: #080808;
            --bg-surface: #151515;
            --bg-secondary: #1C1C1C;
            --accent: #c71515;
            --accent-soft: #a00f0f;
            --white: #FFFFFF;
            --text-muted: #A7A7A7;
            --border-subtle: rgba(255,255,255,0.08);
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 8px 32px rgba(0,0,0,0.6);
            --transition: 0.25s ease;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--white);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 40px;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Header */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-subtle);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 50px;
            transition: all 0.2s;
        }

        .header .back-btn:hover {
            color: var(--white);
            background: rgba(255,255,255,0.08);
        }

        .header .back-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .header .logo img {
            height: 32px;
            width: auto;
            object-fit: contain;
        }

        /* Main Container */
        .container {
            max-width: 500px;
            margin: 20px auto;
            padding: 0 16px;
        }

        /* Movie Card */
        .movie-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .poster-wrap {
            width: 100%;
            aspect-ratio: 3/4;
            background: var(--bg-secondary);
            position: relative;
        }

        .poster-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            color: var(--white);
            font-size: 0.65rem;
            font-weight: 700;
            padding: 5px 10px;
            border-radius: 20px;
            border: 1px solid var(--border-subtle);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-content {
            padding: 16px;
        }

        .movie-title {
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        .movie-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .movie-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .movie-price {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 16px;
        }

        .watch-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--accent), var(--accent-soft));
            color: #fff;
            padding: 14px;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-weight: 800;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .watch-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(199,21,21,0.4);
        }

        .watch-btn:active {
            transform: scale(0.98);
        }

        .watch-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Video Section */
        #player {
            width: 100%;
            max-width: 100%;
            background: #000;
            border-radius: var(--radius-sm);
            margin-top: 20px;
            display: none;
            aspect-ratio: 16/9;
        }

        #countdown {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 12px;
            font-weight: 600;
        }

        #countdown.warning {
            color: #ff9800;
        }

        /* Empty/Loading State */
        .loading-state {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <a href="non.html" class="back-btn">
            <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Back
        </a>
        <div class="logo">
            <img src="images/logo-akimark.png" onerror="this.onerror=null; this.src='images/logo-akimark.jpg';" alt="Akimark">
        </div>
        <span style="width: 60px;"></span>
    </header>

    <!-- Main Content -->
    <main class="container">
        <!-- Loading State (initial) -->
        <div id="loadingState" class="loading-state">
            <div class="loading-spinner"></div>
            <p>Loading movie...</p>
        </div>

        <!-- Movie Card (hidden until data loaded) -->
        <div id="movieCard" class="movie-card" style="display:none;">
            <div class="poster-wrap">
                <img id="poster" src="" alt="Movie Poster">
                <span id="qualityBadge" class="badge">HD</span>
            </div>
            <div class="card-content">
                <h1 id="title" class="movie-title">Movie Title</h1>
                
                <div class="movie-meta">
                    <span id="year">2024</span>
                    <span>•</span>
                    <span id="category">Action</span>
                </div>

                <div id="price" class="movie-price">MK 0.00</div>

                <button id="watchBtn" class="watch-btn">
                    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    WATCH NOW
                </button>
            </div>
        </div>

        <!-- Video Player (hidden until paid) -->
        <video id="player" controls playsinline></video>
        <p id="countdown"></p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="javascript.js/supabase.js"></script>
    <script src="javascript.js/non-view.js"></script>
</body>
</html>
