<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Movies - Akimark</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #080808;
            --bg-surface: #151515;
            --bg-secondary: #1C1C1C;
            --accent: #c71515;
            --accent-soft: #a00f0f;
            --white: #FFFFFF;
            --text-muted: #A7A7A7;
            --border-subtle: rgba(255,255,255,0.08);
            --radius: 8px;
            --shadow: 0 4px 12px rgba(0,0,0,0.4);
            --transition: 0.2s cubic-bezier(0.2,0,0,1);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #080808; color: #fff; min-height: 100vh; overflow-x: hidden;
            user-select: none; -webkit-user-select: none; padding-bottom: 80px;
        }
        body::-webkit-scrollbar { display: none; }
        a { color: inherit; text-decoration: none; }
        button { cursor: pointer; font-family: inherit; border: none; background: none; color: inherit; }
        img { display: block; max-width: 100%; }

        /* HEADER */
        .header {
            position: sticky; top: 0; z-index: 100;
            background: #080808; border-bottom: 1px solid var(--border-subtle);
            padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
        }
        .header .logo img { height: 32px; width: auto; }
        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--text-muted); font-size: 0.9rem; font-weight: 600;
            padding: 6px 12px; border-radius: 6px; transition: all 0.2s;
        }
        .back-btn:hover { color: #fff; background: rgba(255,255,255,0.08); }
        .back-btn svg { width: 18px; height: 18px; fill: currentColor; }

        /* MAIN CONTAINER */
        .container { max-width: 900px; margin: 0 auto; padding: 16px; }

        /* SUMMARY */
        .summary-bar {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 12px; font-size: 0.85rem; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .summary-bar span:first-child { font-weight: 700; color: #fff; }

        /* MOVIE LIST */
        .movie-list { display: flex; flex-direction: column; gap: 12px; }

        .movie-item {
            display: flex; align-items: center; gap: 12px;
            background: var(--bg-surface); border: 1px solid var(--border-subtle);
            border-radius: var(--radius); padding: 8px; transition: var(--transition);
        }
        .movie-item:hover { border-color: rgba(199,21,21,0.3); box-shadow: var(--shadow); }

        /* THUMBNAIL */
        .thumb {
            position: relative; width: 160px; aspect-ratio: 16/9;
            background: #222; border-radius: 4px; overflow: hidden; flex-shrink: 0;
        }
        .thumb img { width: 100%; height: 100%; object-fit: cover; }
        .thumb .duration {
            position: absolute; bottom: 8px; right: 8px;
            background: rgba(0,0,0,0.85); color: #fff;
            font-size: 0.75rem; font-weight: 700; padding: 2px 6px; border-radius: 4px;
        }
        .thumb .progress-bar {
            position: absolute; bottom: 0; left: 0; right: 0; height: 4px;
            background: rgba(255,255,255,0.2);
        }
        .thumb .progress-fill {
            height: 100%; background: #00c853; width: 0%; /* green */
        }

        /* INFO */
        .info { flex: 1; min-width: 0; }
        .info h3 {
            font-size: 0.95rem; font-weight: 700; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis; text-transform: uppercase;
            margin-bottom: 4px; color: #fff;
        }
        .info p {
            font-size: 0.75rem; color: var(--text-muted); margin: 0;
            display: flex; align-items: center; gap: 6px;
        }
        .info .expiry {
            color: var(--accent); font-weight: 600;
            background: rgba(199,21,21,0.1); padding: 2px 6px; border-radius: 4px;
        }

        /* MENU */
        .menu-btn {
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-muted); font-size: 1.2rem; transition: background 0.2s, color 0.2s;
        }
        .menu-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }

        /* WATCH BUTTON (small) */
        .watch-link {
            display: inline-block; background: var(--accent); color: #fff;
            padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 700;
            text-decoration: none; margin-top: 6px; transition: background 0.2s;
        }
        .watch-link:hover { background: var(--accent-soft); }
        .watch-link.disabled { background: #444; pointer-events: none; }

        /* EMPTY STATE */
        .empty-state {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 60vh; text-align: center; padding: 20px;
        }
        .empty-state i { font-size: 4rem; color: var(--text-muted); margin-bottom: 12px; }
        .empty-state h3 { font-size: 1.2rem; margin-bottom: 8px; }
        .empty-state p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px; }
        .empty-btn {
            display: inline-block; background: var(--accent); color: #fff;
            padding: 10px 24px; border-radius: 50px; font-weight: 700; text-decoration: none;
        }

        .toast {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            background: var(--bg-surface); border: 1px solid var(--border-subtle);
            border-radius: 6px; padding: 12px 20px; box-shadow: var(--shadow);
            display: none; font-size: 0.9rem; z-index: 999;
        }
        .toast.visible { display: block; }

        @media (max-width: 500px) {
            .thumb { width: 120px; }
            .info h3 { font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="home.html" class="back-btn">
            <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Home
        </a>
        <div class="logo"><img src="images/logo-akimark.png" onerror="this.onerror=null; this.src='images/logo-akimark.jpg';" alt="Akimark"></div>
        <span style="width:80px;"></span>
    </header>

    <main class="container">
        <div class="summary-bar" id="summaryBar">
            <span>0 VIDEOS</span>
            <span>0.0 GB</span>
        </div>
        <div id="movieList" class="movie-list"></div>
        <div id="emptyState" class="empty-state" style="display:none;">
            <i class="bi bi-film"></i>
            <h3>No active movies</h3>
            <p>You haven't purchased any movies yet.</p>
            <a href="home.html" class="empty-btn">Browse Movies</a>
        </div>
    </main>

    <div id="toast" class="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="javascript.js/supabase.js"></script>
    <script src="javascript.js/my-movies.js"></script>
</body>
</html>
