<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Movies - Akimark</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #080808;
            --bg-surface: #151515;
            --bg-secondary: #1C1C1C;
            --accent: #c71515;
            --accent-soft: #a00f0f;
            --white: #FFFFFF;
            --text-muted: #A7A7A7;
            --border-subtle: rgba(255,255,255,0.08);
            --radius: 10px;
            --radius-sm: 6px;
            --shadow: 0 8px 24px rgba(0,0,0,0.5);
            --transition: 0.25s cubic-bezier(0.2,0,0,1);
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-primary); color: #fff; min-height: 100vh; overflow-x: hidden; user-select: none; -webkit-user-select: none; padding-bottom: 80px; }
        body::-webkit-scrollbar { display: none; }
        a { color: inherit; text-decoration: none; }
        button { cursor: pointer; font-family: inherit; border: none; background: none; color: inherit; }
        img { display: block; max-width: 100%; }

        .header { position: sticky; top:0; z-index:100; background: #080808; border-bottom: 1px solid var(--border-subtle); padding: 12px 16px; display:flex; align-items:center; justify-content:space-between; }
        .header .logo img { height: 32px; width:auto; }
        .back-btn { display:inline-flex; align-items:center; gap:6px; color: var(--text-muted); font-size:0.9rem; font-weight:600; padding:6px 12px; border-radius:6px; transition: all 0.2s; }
        .back-btn:hover { color:#fff; background: rgba(255,255,255,0.08); }
        .back-btn svg { width:18px; height:18px; fill: currentColor; }

        .container { max-width: 900px; margin: 0 auto; padding: 16px; }

        .page-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; }
        .page-title span { color: var(--accent); }

        .empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height: 60vh; text-align:center; padding:20px; }
        .empty-state i { font-size: 4rem; color: var(--text-muted); margin-bottom: 12px; }
        .empty-state h3 { font-size:1.2rem; margin-bottom:8px; }
        .empty-state p { color: var(--text-muted); font-size:0.9rem; margin-bottom:20px; }
        .empty-btn { display:inline-block; background: var(--accent); color:#fff; padding:10px 24px; border-radius:50px; font-weight:700; }

        .movie-grid { display:grid; grid-template-columns: repeat(2, 1fr); gap:12px; }
        @media (min-width: 600px) { .movie-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 900px) { .movie-grid { grid-template-columns: repeat(4, 1fr); } }

        .movie-card { background: var(--bg-surface); border-radius: var(--radius); overflow: hidden; transition: var(--transition); border: 1px solid var(--border-subtle); position: relative; }
        .movie-card:hover { transform: translateY(-4px); box-shadow: var(--shadow); border-color: rgba(199,21,21,0.3); }
        .movie-card .poster { aspect-ratio: 2/3; background: var(--bg-secondary); position: relative; }
        .movie-card .poster img { width:100%; height:100%; object-fit: cover; }
        .movie-card .badge { position:absolute; top:8px; right:8px; background: rgba(0,0,0,0.7); color:#fff; font-size:0.65rem; font-weight:700; padding:4px 8px; border-radius:20px; z-index:2; }
        .movie-card .info { padding:10px; }
        .movie-card .info h3 { font-size:0.85rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-transform:uppercase; margin-bottom:6px; }
        .movie-card .time-left { font-size:0.75rem; font-weight:700; color: var(--accent); margin-bottom:8px; background: rgba(199,21,21,0.1); border-radius:4px; padding:4px 6px; display:inline-block; }
        .movie-card .watch-btn { width:100%; display:block; background: var(--accent); color:#fff; padding:8px 0; border-radius:6px; text-align:center; font-weight:700; font-size:0.85rem; transition: background 0.2s; }
        .movie-card .watch-btn:hover { background: var(--accent-soft); }
        .movie-card .watch-btn.expired { background: #444; cursor: not-allowed; }
        .movie-card .watch-btn.expired:hover { background: #444; }

        .toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background: var(--bg-surface); border:1px solid var(--border-subtle); border-radius:6px; padding:12px 20px; box-shadow: var(--shadow); display:none; font-size:0.9rem; z-index:999; }
        .toast.visible { display:block; }
    </style>
</head>
<body>
    <header class="header">
        <a href="home.html" class="back-btn">
            <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Home
        </a>
        <div class="logo"><img src="images/logo-akimark.png" onerror="this.onerror=null; this.src='images/logo-akimark.jpg';" alt="Akimark"></div>
        <span style="width:80px;"></span>
    </header>

    <main class="container">
        <h1 class="page-title">My <span>Movies</span></h1>
        <div id="moviesGrid" class="movie-grid"></div>
        <div id="emptyState" class="empty-state" style="display:none;">
            <i class="bi bi-film"></i>
            <h3>No active movies</h3>
            <p>You haven't purchased any movies yet.</p>
            <a href="home.html" class="empty-btn">Browse Movies</a>
        </div>
    </main>

    <div id="toast" class="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="javascript.js/supabase.js"></script>
    <script src="javascript.js/my-movies.js"></script>
</body>
</html>
