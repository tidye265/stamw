<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Watch - Akimark</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #fff; font-family: -apple-system, sans-serif; }
        #player-container { max-width: 100%; position: relative; }
        video { width: 100%; height: auto; max-height: 85vh; display: block; background: #000; }
        .controls {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            padding: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
            opacity: 0; transition: opacity 0.3s;
        }
        #player-container:hover .controls, #player-container.touch .controls { opacity: 1; }
        .btn { background: rgba(255,255,255,0.2); border: none; color: #fff; border-radius: 5px; padding: 8px 12px; font-size: 16px; cursor: pointer; }
        .btn:hover { background: rgba(255,255,255,0.4); }
        input[type="range"] { flex: 1; accent-color: #E11D48; height: 4px; }
        #timeDisplay { font-size: 12px; min-width: 60px; text-align: center; }
        #loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; }
        .spinner { border: 4px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #movie-info { padding: 16px; }
        h1 { font-size: 1.3rem; margin-bottom: 8px; }
        p { color: #ccc; font-size: 0.9rem; }
        .error-box { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; text-align: center; }
        .error-box button { margin-top: 16px; padding: 10px 20px; background: #E11D48; color: #fff; border: none; border-radius: 6px; font-size: 1rem; }
    </style>
</head>
<body>
    <div id="player-container">
        <video id="video" playsinline webkit-playsinline controls></video>
        <div id="loader"><div class="spinner"></div></div>
        <div class="controls" id="controls">
            <button class="btn" id="playPauseBtn">▶</button>
            <input type="range" id="seekBar" min="0" max="100" step="0.1" value="0">
            <span id="timeDisplay">0:00 / 0:00</span>
            <button class="btn" id="muteBtn">🔊</button>
            <button class="btn" id="fullscreenBtn">⛶</button>
        </div>
    </div>
    <div id="movie-info">
        <h1 id="title"></h1>
        <p id="desc"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="javascript/watch.js"></script>
</body>
</html>
