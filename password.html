<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }
        .container {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 30px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #e63946;
        }
        .password-display {
            background: #222;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 15px;
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 20px;
            word-break: break-all;
            font-family: monospace;
            color: #4caf50;
        }
        .options {
            margin-bottom: 15px;
        }
        .option-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        label {
            font-size: 0.9rem;
            color: #ccc;
        }
        input[type="number"] {
            width: 60px;
            padding: 5px;
            border: 1px solid #333;
            border-radius: 4px;
            background: #222;
            color: #fff;
        }
        input[type="checkbox"] {
            accent-color: #e63946;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #e63946;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover {
            background: #c1121f;
        }
        button.copy {
            background: #2196f3;
        }
        button.copy:hover {
            background: #1976d2;
        }
        .message {
            text-align: center;
            margin-top: 10px;
            font-size: 0.9rem;
            color: #4caf50;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Generate Password</h2>
        <div class="password-display" id="passwordDisplay">Click Generate</div>
        <div class="options">
            <div class="option-row">
                <label>Length</label>
                <input type="number" id="length" min="8" max="64" value="16">
            </div>
            <div class="option-row">
                <label>Uppercase (A-Z)</label>
                <input type="checkbox" id="uppercase" checked>
            </div>
            <div class="option-row">
                <label>Lowercase (a-z)</label>
                <input type="checkbox" id="lowercase" checked>
            </div>
            <div class="option-row">
                <label>Numbers (0-9)</label>
                <input type="checkbox" id="numbers" checked>
            </div>
            <div class="option-row">
                <label>Symbols (!@#$...)</label>
                <input type="checkbox" id="symbols" checked>
            </div>
        </div>
        <button onclick="generate()">Generate Password</button>
        <button class="copy" onclick="copyPassword()">Copy to Clipboard</button>
        <div class="message" id="message"></div>
    </div>

    <script>
        function generate() {
            const length = parseInt(document.getElementById('length').value);
            const useUpper = document.getElementById('uppercase').checked;
            const useLower = document.getElementById('lowercase').checked;
            const useNumbers = document.getElementById('numbers').checked;
            const useSymbols = document.getElementById('symbols').checked;

            if (length < 8 || length > 64) {
                alert('Length must be between 8 and 64.');
                return;
            }

            const upper = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const lower = 'abcdefghijklmnopqrstuvwxyz';
            const numbers = '0123456789';
            const symbols = '!@#$%^&*()_+~`|}{[]:;?><,./-=';

            let chars = '';
            if (useUpper) chars += upper;
            if (useLower) chars += lower;
            if (useNumbers) chars += numbers;
            if (useSymbols) chars += symbols;

            if (chars === '') {
                alert('Select at least one character type.');
                return;
            }

            let password = '';
            for (let i = 0; i < length; i++) {
                const randomIndex = Math.floor(Math.random() * chars.length);
                password += chars[randomIndex];
            }

            document.getElementById('passwordDisplay').textContent = password;
            document.getElementById('message').textContent = '';
        }

        function copyPassword() {
            const password = document.getElementById('passwordDisplay').textContent;
            if (password === 'Click Generate') {
                alert('Generate a password first.');
                return;
            }
            navigator.clipboard.writeText(password).then(() => {
                document.getElementById('message').textContent = 'Password copied!';
                setTimeout(() => document.getElementById('message').textContent = '', 2000);
            }).catch(() => {
                alert('Failed to copy. Copy manually.');
            });
        }
    </script>
</body>
                  </html>
