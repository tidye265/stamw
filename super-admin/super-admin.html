<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 50%, #0f0f0f 100%);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-wrapper {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }
        .welcome-back {
            font-size: 1.5rem;
            margin-bottom: 30px;
            color: #e63946;
            font-weight: 800;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: #aaa;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #333;
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #e63946;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #e63946;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 15px;
            transition: background 0.3s, transform 0.2s;
        }
        button:hover {
            background: #c1121f;
            transform: translateY(-1px);
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }
        #otpSection {
            display: none;
        }
        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
            min-height: 20px;
        }
        .error { color: #ff4d4d; }
        .success { color: #4caf50; }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .forgot-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #aaa;
            font-size: 0.9rem;
            text-decoration: none;
            transition: color 0.3s;
        }
        .forgot-link:hover {
            color: #e63946;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #777;
            font-size: 0.85rem;
            text-decoration: none;
        }
        .back-link:hover {
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <h1>WELCOME BACK 🤗</h1>

        <!-- Step 1: Email + Password -->
        <div id="step1">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="admin@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button id="loginBtn" onclick="sendOTP()">Login</button>
            <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>
        </div>

        <!-- Step 2: OTP Verification -->
        <div id="otpSection">
            <div class="form-group">
                <label>Enter OTP</label>
                <input type="text" id="otp" placeholder="6-digit code" maxlength="6" required>
            </div>
            <button id="verifyBtn" onclick="verifyOTP()">Verify & Login</button>
            <a href="#" class="back-link" onclick="goBack()">← Back to Login</a>
        </div>

        <div id="message" class="message"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../javascript.js/supabase.js"></script>
    <script src="super-admin.js"></script>
</body>
</html>
