<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Super Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 50%, #0f0f0f 100%);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .wrapper {
            width: 100%;
            max-width: 440px;
            background: rgba(26, 26, 26, 0.9);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        h1 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: #fff;
            letter-spacing: -0.5px;
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
        }
        .step-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #333;
            transition: background 0.3s;
        }
        .step-dot.active {
            background: #e63946;
        }
        .step-dot.completed {
            background: #4caf50;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: #aaa;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #333;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s, background 0.3s;
        }
        input:focus {
            border-color: #e63946;
            background: rgba(255, 255, 255, 0.08);
        }
        input::placeholder {
            color: #555;
        }
        .btn-primary {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #e63946;
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            margin-top: 5px;
        }
        .btn-primary:hover {
            background: #c1121f;
            transform: translateY(-1px);
        }
        .btn-primary:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }
        .btn-secondary {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
            min-height: 24px;
            padding: 8px;
            border-radius: 6px;
        }
        .error { color: #ff4d4d; background: rgba(255, 77, 77, 0.1); }
        .success { color: #4caf50; background: rgba(76, 175, 80, 0.1); }
        .info { color: #2196f3; background: rgba(33, 150, 243, 0.1); }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #777;
            font-size: 0.85rem;
            text-decoration: none;
            transition: color 0.3s;
        }
        .back-link:hover {
            color: #e63946;
        }
        .password-strength {
            display: flex;
            gap: 5px;
            margin-top: 8px;
        }
        .strength-bar {
            flex: 1;
            height: 4px;
            background: #333;
            border-radius: 2px;
            transition: background 0.3s;
        }
        .strength-weak .strength-bar { background: #ff4d4d; }
        .strength-medium .strength-bar { background: #ffcc00; }
        .strength-strong .strength-bar { background: #4caf50; }
        .strength-text {
            font-size: 0.75rem;
            margin-top: 4px;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <h1>Reset Password</h1>
        <p class="subtitle">Enter your email to receive a verification code</p>

        <!-- Step indicators -->
        <div class="step-indicator">
            <div class="step-dot active" id="stepDot1"></div>
            <div class="step-dot" id="stepDot2"></div>
        </div>

        <!-- Step 1: Enter Email -->
        <div id="step1">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="admin@example.com" required autocomplete="email">
            </div>
            <button id="sendOtpBtn" class="btn-primary" onclick="sendOTP()">Send Verification Code</button>
        </div>

        <!-- Step 2: OTP + New Password -->
        <div id="step2" style="display: none;">
            <div class="form-group">
                <label>Enter OTP</label>
                <input type="text" id="otp" placeholder="6-digit code" maxlength="6" inputmode="numeric" required>
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPassword" placeholder="Minimum 8 characters" required>
                <div class="password-strength" id="passwordStrength">
                    <div class="strength-bar"></div>
                    <div class="strength-bar"></div>
                    <div class="strength-bar"></div>
                </div>
                <div class="strength-text" id="strengthText"></div>
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm new password" required>
            </div>
            <button id="resetBtn" class="btn-primary" onclick="resetPassword()">Reset Password</button>
            <button class="btn-secondary" onclick="goBack()">Back to Email</button>
        </div>

        <a href="super-admin.html" class="back-link">← Back to Login</a>
        <div id="message" class="message"></div>
    </div>

    <script src="forgot-password.js"></script>
</body>
</html>
