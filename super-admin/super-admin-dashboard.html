<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #080808;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== HEADER ===== */
        .header {
            background: #111;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
        }
        .logo {
            font-size: 1.1rem;
            font-weight: 800;
            color: #e63946;
            letter-spacing: -0.5px;
        }
        .hamburger {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            line-height: 1;
        }

        /* ===== SIDEBAR (Hamburger Menu) ===== */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
        }
        .overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .sidebar {
            position: fixed;
            top: 0;
            right: -260px;
            width: 260px;
            height: 100vh;
            background: #111;
            z-index: 1000;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
            padding-top: 20px;
        }
        .sidebar.open {
            right: 0;
        }
        .sidebar-header {
            padding: 0 20px 15px;
            border-bottom: 1px solid #222;
            margin-bottom: 10px;
        }
        .sidebar-header span {
            font-size: 1.1rem;
            font-weight: 700;
            color: #e63946;
        }
        .sidebar-item {
            padding: 12px 20px;
            color: #ccc;
            text-decoration: none;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        .sidebar-item:hover {
            background: #222;
            color: #fff;
        }
        .sidebar-item.active {
            color: #fff;
            border-left: 3px solid #e63946;
            background: #1a1a1a;
        }
        .sidebar-item.logout {
            color: #ff4d4d;
            margin-top: auto;
            border-top: 1px solid #222;
        }
        .sidebar-item.logout:hover {
            background: #2a1111;
        }

        /* ===== MAIN CONTENT ===== */
        .container {
            padding: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
        }
        .error-msg {
            text-align: center;
            padding: 15px;
            background: #2a1a1a;
            color: #ff4d4d;
            border-radius: 4px;
            margin: 20px auto;
            max-width: 400px;
            font-size: 0.9rem;
        }

        /* ===== STATS GRID (Minimalist & Small) ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 8px;
            margin-bottom: 0;
        }
        .stat-card {
            background: #111;
            border-radius: 4px;
            padding: 12px;
            border: none;
            border-left: 2px solid #e63946;
        }
        .stat-card h3 {
            font-size: 0.75rem;
            font-weight: 500;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat-card .value {
            font-size: 1.6rem;
            font-weight: 800;
            color: #fff;
            line-height: 1.2;
        }

        /* ===== DESKTOP STYLING ===== */
        @media (min-width: 768px) {
            .container {
                padding: 20px;
            }
            .stats-grid {
                grid-template-columns: repeat(5, 1fr);
                gap: 10px;
            }
            .stat-card {
                padding: 15px;
            }
            .hamburger {
                display: block;
            }
            .sidebar {
                width: 280px;
            }
        }
    </style>
</head>
<body>

    <!-- Overlay for sidebar -->
    <div id="overlay" class="overlay" onclick="toggleMenu()"></div>

    <!-- Sidebar Menu -->
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <span>AKIMARK</span>
        </div>
        <a class="sidebar-item active" onclick="selectMenu('dashboard')">Dashboard</a>
        <a class="sidebar-item" onclick="selectMenu('logins')">Logins Details</a>
        <a class="sidebar-item" onclick="selectMenu('users')">Users</a>
        <a class="sidebar-item" onclick="selectMenu('admin_users')">Admin Users</a>
        <a class="sidebar-item logout" onclick="logout()">Logout</a>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="logo">Akimark</div>
        <button class="hamburger" onclick="toggleMenu()">☰</button>
    </header>

    <!-- Main Content -->
    <main class="container">
        <div id="loading" class="loading">Loading dashboard...</div>
        <div id="errorBox" style="display: none;"></div>
        <div id="dashboardContent" style="display: none;">
            <div class="stats-grid">
                <div class="stat-card accent">
                    <h3>Total Admins</h3>
                    <div class="value" id="totalAdmins">0</div>
                </div>
                <div class="stat-card">
                    <h3>Total Users</h3>
                    <div class="value" id="totalUsers">0</div>
                </div>
                <div class="stat-card">
                    <h3>Admin Balance</h3>
                    <div class="value" id="adminBalance">0.00</div>
                </div>
                <div class="stat-card">
                    <h3>User Balance</h3>
                    <div class="value" id="userBalance">0.00</div>
                </div>
                <div class="stat-card">
                    <h3>Admin Followers</h3>
                    <div class="value" id="adminFollowers">0</div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../javascript.js/supabase.js"></script>
    <script src="super-admin-dashboard.js"></script>
</body>
</html>
