<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #fff;
            min-height: 100vh;
        }
        .header {
            background: #1a1a1a;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #e63946;
        }
        .admin-info {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .logout-btn {
            background: #e63946;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        .logout-btn:hover {
            background: #c1121f;
        }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #1a1a1a;
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #333;
        }
        .stat-card h3 {
            font-size: 0.9rem;
            color: #999;
            margin-bottom: 10px;
        }
        .stat-card .value {
            font-size: 2rem;
            font-weight: 800;
            color: #fff;
        }
        .stat-card.accent {
            border-left: 4px solid #e63946;
        }
        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
        }
        .error-msg {
            text-align: center;
            padding: 20px;
            background: #2a1a1a;
            color: #ff4d4d;
            border-radius: 10px;
            margin: 20px auto;
            max-width: 600px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">Akimark Super Admin</div>
        <div class="admin-info">
            <span id="adminName">Loading...</span>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </header>

    <div class="container">
        <div id="loading" class="loading">Loading dashboard...</div>
        <div id="errorBox" style="display: none;"></div>
        <div id="dashboardContent" style="display: none;">
            <div class="stats-grid">
                <div class="stat-card accent">
                    <h3>Total Admins</h3>
                    <div class="value" id="totalAdmins">0</div>
                </div>
                <div class="stat-card">
                    <h3>Total Users</h3>
                    <div class="value" id="totalUsers">0</div>
                </div>
                <div class="stat-card">
                    <h3>Admin Balance (MK)</h3>
                    <div class="value" id="adminBalance">0.00</div>
                </div>
                <div class="stat-card">
                    <h3>User Balance (MK)</h3>
                    <div class="value" id="userBalance">0.00</div>
                </div>
                <div class="stat-card">
                    <h3>Admin Followers</h3>
                    <div class="value" id="adminFollowers">0</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../javascript.js/supabase.js"></script>
    <script src="super-admin-dashboard.js"></script>
</body>
</html>
